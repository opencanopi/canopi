name: Phone smoke

# The phone smoke (ADR 0029 Platform matrix): Safari in iPhone and iPad simulators, Chrome on an Android emulator, each
# with its inverted step (the lane run against a planted blank page must fail, or the job fails; plan:157). It binds no
# merge: Build & Test leaves it out (design check AR3), as hosted macOS and emulator runners fail or queue for reasons
# no change makes (canopi-f47t.52.261, canopi-f47t.52.228.47). A dispatch with update_snapshots records the browsers'
# screenshot baselines instead.
on:
  # What the phones load: the Web Edition and the version it shows (tauri.conf.json, read by About).
  push:
    branches: [main, release/2.0]
    paths: ['desktop/web/**', '!desktop/web/**/*.md', 'desktop/tauri.conf.json', '.github/workflows/phone-smoke.yml']
  pull_request:
    branches: [main, release/2.0]
    paths: ['desktop/web/**', '!desktop/web/**/*.md', 'desktop/tauri.conf.json', '.github/workflows/phone-smoke.yml']
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Record the screenshot baselines in the pinned image and upload them as an artifact
        type: boolean
        default: false

# A PR update cancels that PR's older run. Every other run (a push to main or release/2.0, a manual run) has a group of
# its own, so it always finishes: a shared group would let GitHub drop a pending run whatever cancel-in-progress says.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ios:
    name: iOS ${{ matrix.device }} (Safari, simulator)
    if: >-
      !inputs.update_snapshots &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      github.head_ref != 'main')
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The phone layout and the tablet layout (ADR 0029:26). Each boots the newest simulator whose name starts with
        # its prefix. ADR 0029, plan F5 and 2.1-Q77 name no iPad model, so the tablet is the smallest current iPad that
        # still has tablet width: the iPad mini (744 CSS px wide, over the phone layout's 640) draws about 3.4 Mpx where
        # the 13-inch iPad Pro draws 5.7 Mpx, which lost its WebGL context in the simulator's software GPU (F5 probe 7).
        device: [iPhone, iPad]
        include:
          - device: iPhone
            simulator: iPhone
          - device: iPad
            simulator: iPad mini
    defaults:
      run:
        shell: bash
        working-directory: desktop/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            desktop/web/package-lock.json
            desktop/web/e2e/platform/phones/ios/appium/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build:web
      - name: Serve the Web Edition
        run: |
          nohup npx vite preview --mode web --port 4174 --strictPort > "$RUNNER_TEMP/preview.log" 2>&1 &
          for _ in $(seq 60); do curl -fsS http://localhost:4174/web.html > /dev/null && exit 0; sleep 2; done
          echo "::error::vite preview did not answer"; exit 1
      # A simulator that does not boot fails the job; it never skips (plan:181). The hardware keyboard is turned off
      # first, since Simulator reads it only at launch: with it, iPad Safari kept its address bar focused and crashed on
      # the first tap. simctl boots the device, then Simulator.app opens on it, so the two never race to boot it and the
      # XCUITest driver finds its UI visible and does not reboot it, a second boot that ran past the driver's wait on
      # slow runners (canopi-f47t.52.228.11).
      - name: Boot the newest ${{ matrix.simulator }} simulator
        run: |
          read -r udid version name < <(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              # com.apple.CoreSimulator.SimRuntime.iOS-26-5 is iOS 26.5, written the way the XCUITest driver reads it.
              return runtime.rsplit(".", 1)[-1].removeprefix("iOS-").replace("-", ".", 1)
          runtimes = (k for k in devices if ".SimRuntime.iOS-" in k)
          for runtime in sorted(runtimes, key=lambda k: [int(p) for p in version(k).split(".") if p.isdigit()], reverse=True):
              for device in devices[runtime]:
                  if device["name"].startswith(sys.argv[1]):
                      print(device["udid"], version(runtime), device["name"]); sys.exit()
          ' "${{ matrix.simulator }}")
          if [ -z "${udid:-}" ]; then echo "::error::no ${{ matrix.simulator }} simulator on this runner"; exit 1; fi
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl boot "$udid" || [ "$(xcrun simctl list devices -j | python3 -c 'import json,sys; print(next(d["state"] for r in json.load(sys.stdin)["devices"].values() for d in r if d["udid"]==sys.argv[1]))' "$udid")" = Booted ]
          open -a Simulator --args -CurrentDeviceUDID "$udid"
          xcrun simctl bootstatus "$udid"
          echo "Booted $name, iOS $version, $udid"
          echo "CANOPI_IOS_DEVICE=$name" >> "$GITHUB_ENV"
          echo "CANOPI_IOS_VERSION=$version" >> "$GITHUB_ENV"
          echo "CANOPI_IOS_UDID=$udid" >> "$GITHUB_ENV"
      # Safari is driven through Appium's XCUITest driver, not safaridriver, whose fixed ~34 s connect wait hosted
      # runners exceed (2.1-Q247). Both are this lane's dev dependencies, pinned exactly in e2e/platform/phones/ios/appium
      # with their own lockfile, so the dependency tooling (Renovate and the OSV scan, F3c) can see them, every run
      # installs the same tree, and only this job installs them. appium 3.9.0 and appium-xcuitest-driver 12.22.7 went in
      # before the two-week wait as security updates (2.1-Q245: GHSA-27r3-jxmh-p828, GHSA-pqg4-j6r4-53mv). That directory
      # is Appium's home, where it finds the driver.
      - name: Install Appium and the XCUITest driver
        working-directory: desktop/web/e2e/platform/phones/ios/appium
        run: |
          npm ci --no-fund
          echo "APPIUM_HOME=$PWD" >> "$GITHUB_ENV"
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
          export APPIUM_HOME="$PWD" PATH="$PWD/node_modules/.bin:$PATH"
          appium --version
          appium driver list --installed
      # WebDriverAgent is built before the first session, so a build failure is reported as one, its log uploaded, and
      # the session starts with the build already done instead of spending its launch wait on xcodebuild.
      - name: Build WebDriverAgent for the simulator
        timeout-minutes: 20
        run: |
          if ! appium driver run xcuitest build-wda --name "$CANOPI_IOS_DEVICE" --sdk "$CANOPI_IOS_VERSION" > "$RUNNER_TEMP/wda-build.log" 2>&1; then
            tail -n 80 "$RUNNER_TEMP/wda-build.log"
            echo "::error::WebDriverAgent did not build for $CANOPI_IOS_DEVICE (iOS $CANOPI_IOS_VERSION)"; exit 1
          fi
      - name: Start Appium
        run: |
          nohup appium --address 127.0.0.1 --port 4723 --log-timestamp --log "$RUNNER_TEMP/appium.log" > /dev/null 2>&1 &
          for _ in $(seq 60); do curl -fsS http://127.0.0.1:4723/status > /dev/null && exit 0; sleep 1; done
          echo "::error::Appium did not answer on port 4723"; exit 1
      # No retry anywhere in the lane: a session that fails to start, even once, fails the job (plan:181).
      - run: npm run test:ios
      # The smoke passes on the simulator's GPU process crash only with the proof it read itself from the simulator log
      # (e2e/platform/phones/ios/simulator-verdict.ts, F5 probe 8); it writes that ENV verdict here, and the job shows
      # it as a warning and keeps the logs.
      - name: Report an ENV verdict
        run: |
          verdict="$RUNNER_TEMP/ios-env-verdict.txt"
          [ -f "$verdict" ] || exit 0
          message="$(sed -e 's/%/%25/g' "$verdict" | tr '\n' ' ')"
          echo "::warning title=iOS ${{ matrix.device }} passed on ENV (the simulator's GPU process crashed)::$message"
          echo "CANOPI_IOS_ENV=1" >> "$GITHUB_ENV"
      - name: The iOS lane fails on a planted blank page
        run: |
          set -o pipefail
          if CANOPI_E2E_PLANTED_PAGE=about:blank npm run test:ios 2>&1 | tee "$RUNNER_TEMP/test-ios-planted.log"; then
            echo "::error::the iOS smoke passed on a blank page: it cannot fail"; exit 1
          fi
          # Only the smoke's own failure on the blank page counts. A session that never started (an Appium POST /session
          # error, a WebDriverAgent launch timeout) proves nothing, so the smoke's start-screen message is required.
          if ! grep -qF 'the start screen was not displayed 90 s after opening about:blank' "$RUNNER_TEMP/test-ios-planted.log"; then
            echo "::error::the iOS smoke did not fail on the planted page itself (no session, or it failed before checking the page)"; exit 1
          fi
      # A page whose web content process dies shows only as a crash page in the smoke (F5 probe 7); the simulator's own
      # log and crash reports say whether it was memory (jetsam) or a GPU process fault.
      - name: Collect the simulator crash logs
        if: ${{ failure() && env.CANOPI_IOS_UDID != '' }}
        run: |
          xcrun simctl spawn "$CANOPI_IOS_UDID" log show --last 15m --style compact \
            --predicate 'process CONTAINS "WebContent" OR process CONTAINS "GPU" OR process CONTAINS "MobileSafari" OR eventMessage CONTAINS[c] "jetsam"' \
            > "$RUNNER_TEMP/simulator-webcontent.log" 2>&1 || echo "::warning::the simulator log could not be read"
          mkdir -p "$RUNNER_TEMP/crash-reports"
          for dir in "$HOME/Library/Logs/DiagnosticReports" "$HOME/Library/Developer/CoreSimulator/Devices/$CANOPI_IOS_UDID/data/Library/Logs/CrashReporter"; do
            [ -d "$dir" ] || continue
            find "$dir" -type f -mmin -60 \( -iname '*WebContent*' -o -iname '*GPU*' -o -iname '*Safari*' -o -iname '*JetsamEvent*' \) \
              -exec cp {} "$RUNNER_TEMP/crash-reports/" \;
          done
          ls -l "$RUNNER_TEMP/crash-reports"
      - name: Upload the logs
        if: ${{ failure() || env.CANOPI_IOS_ENV == '1' }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-${{ matrix.device }}
          # The preview, WebDriverAgent build, Appium server, smoke and simulator logs (an ENV verdict's included), the
          # simulator's crash reports and the failed test's screenshot.
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/crash-reports/
            ${{ runner.temp }}/ios-failure-*.png
          if-no-files-found: ignore
          retention-days: 14

  android:
    name: Android (Chrome, emulator)
    if: >-
      !inputs.update_snapshots &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      github.head_ref != 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop/web
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build:web
      - name: Serve the Web Edition
        run: |
          nohup npx vite preview --mode web --port 4174 --strictPort > "$RUNNER_TEMP/preview.log" 2>&1 &
          for _ in $(seq 60); do curl -fsS http://localhost:4174/web.html > /dev/null && exit 0; sleep 2; done
          echo "::error::vite preview did not answer"; exit 1
      # An emulator that does not boot fails this step and the job; it never skips (plan:181).
      - name: Smoke the Web Edition in Chrome on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: desktop/web
          script: |
            adb reverse tcp:4174 tcp:4174
            npm run test:android
            sh e2e/phones/android/inverted.sh
      - name: Upload the logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore
          retention-days: 14

  snapshots:
    name: Record the screenshot baselines
    if: ${{ inputs.update_snapshots }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: desktop/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build:web
      # Pixels and ARIA snapshots in the three engines; headed Firefox under Xvfb (playwright.config.ts).
      - run: xvfb-run -a -s "-screen 0 1920x1200x24" npx playwright test e2e/canvas --project=chromium --project=webkit --project=firefox --update-snapshots
        env:
          HOME: /root
      - name: Upload the recorded baselines
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: web-edition-snapshots
          path: desktop/web/e2e/**/*-snapshots/
          if-no-files-found: error
