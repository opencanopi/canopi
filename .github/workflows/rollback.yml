name: Rollback lane

# Step 2.0.4 R4 (canopi-f47t.52.239; ADR 0026 Checks, contracts §11 Rollback harness, 2.1-M37, 2.1-M53, 2.1-M68,
# 2.1-M484): a reader release reads every store a later release writes, newer-read-only with its notice, and writes no
# byte of it.
# - resolve: the reader and writer refs (policy/gate/rollback-refs.ts says when each mode holds), in the job summary and
#   as job outputs.
# - writer: the writer tree (the candidate, or main or the pending store step's branch on a maintenance branch; the
#   candidate itself in candidate mode) lays down every form spec/rollback/manifest.json lists, uploaded as one fixture
#   directory. A store no build writes yet is laid down from its frozen form, a `FIXTURES-ONLY` line in the summary.
# - reader-desktop and reader-web: the reader tree (needs.resolve.outputs.reader: the latest stable tag, or the
#   candidate before the reader release is tagged; a tag that fails to build is red, never replaced by head's tree) runs
#   its own harness over that directory: desktop/tests/rollback_reader.rs and desktop/web/e2e-rollback/, frozen at the
#   tag, which a later reader release may extend but never break. Around them this tree's fixture checks
#   (`node lane/policy/gate/cli.mjs rollback-fixtures`) refuse a missing artifact, fail on a fixture file the Desktop
#   readers changed, created or pruned (a created -shm or an empty -wal is SQLite's engine metadata), and plant an
#   unreadable change the readers' second run must fail on.
# Build & Test calls it when the gate's rollback area is selected, on a push or pull request into main or release/2.0
# (and the release branch cut from main inherits that call); a Release Candidate calls it as a release check; a
# dispatch runs it for one branch. A skipped job passes Build & Test's aggregate; a failed or cancelled one fails it.
on:
  workflow_call:
    inputs:
      candidate:
        description: The commit under test (the caller's own when empty)
        required: false
        type: string
      branch:
        description: The branch the run is for (a pull request's base or the pushed branch when empty)
        required: false
        type: string
      writer_ref:
        description: On a release/<major>.<minor> branch, the pending store step's branch the readers read (main if empty)
        required: false
        type: string
  workflow_dispatch:
    inputs:
      writer_ref:
        description: On a release/<major>.<minor> branch, the pending store step's branch the readers read (main if empty)
        type: string
        default: ''

# Its own literal group: a called workflow's github.workflow is its caller's name, whose group it would share. A pull
# request's newer run cancels its older one; every other run has a group of its own.
concurrency:
  group: rollback-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# An explicit bash runs with pipefail, so `cargo … | tee` keeps cargo's exit status.
defaults:
  run:
    shell: bash

jobs:
  resolve:
    name: Reader and writer refs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.refs.outputs.mode }}
      reader: ${{ steps.refs.outputs.reader }}
      writer: ${{ steps.refs.outputs.writer }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The tag names from the remote, which the shallow checkout lacks; a failed listing fails the step (pipefail).
      - name: Resolve the reader and writer refs
        id: refs
        env:
          ROLLBACK_BRANCH: ${{ inputs.branch || github.base_ref || github.ref_name }}
          ROLLBACK_CANDIDATE: ${{ inputs.candidate || github.event.pull_request.head.sha || github.sha }}
          ROLLBACK_WRITER_REF: ${{ inputs.writer_ref }}
        run: git ls-remote --tags --refs origin 'refs/tags/v*' | sed 's#^.*refs/tags/##' | node policy/gate/cli.mjs rollback-refs

  writer:
    name: Writer lays down every store form
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CANOPI_SKIP_BUNDLED_DB: "1"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.writer || needs.resolve.outputs.reader }}
      # The tree's own toolchain: with no argument rustup installs what its rust-toolchain.toml pins.
      - name: Install the writer tree's Rust toolchain
        run: rustup toolchain install
      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps
      - name: Write every form the manifest lists
        run: |
          cargo test -p canopi-desktop --test rollback_reader --locked the_writer_lays_down -- --nocapture | tee "$RUNNER_TEMP/writer.log"
          grep '^FIXTURES-ONLY ' "$RUNNER_TEMP/writer.log" >> "$GITHUB_STEP_SUMMARY" || true
        env:
          CANOPI_ROLLBACK_WRITE: ${{ runner.temp }}/rollback-fixtures
      - name: Upload the fixture directory
        uses: actions/upload-artifact@v7
        with:
          name: rollback-fixtures
          path: ${{ runner.temp }}/rollback-fixtures
          if-no-files-found: error
          retention-days: 7

  reader-desktop:
    name: Desktop reader ${{ needs.resolve.outputs.reader }} writes no byte
    needs: [resolve, writer]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CANOPI_SKIP_BUNDLED_DB: "1"
      CARGO_TERM_COLOR: always
    steps:
      # The reader tree at the root, so its toolchain file and its local actions are the ones used; this run's tree,
      # whose fixture checks judge the readers, under lane/.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.reader }}
      - uses: actions/checkout@v7
        with:
          path: lane
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install the reader tree's Rust toolchain
        run: rustup toolchain install
      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps
      - name: Download the fixture directory
        uses: actions/download-artifact@v8
        with:
          name: rollback-fixtures
          path: ${{ runner.temp }}/rollback-fixtures
      - name: Check the fixture directory and record its bytes
        run: |
          node lane/policy/gate/cli.mjs rollback-fixtures check "$RUNNER_TEMP/rollback-fixtures"
          node lane/policy/gate/cli.mjs rollback-fixtures snapshot "$RUNNER_TEMP/rollback-fixtures" "$RUNNER_TEMP/before.json"
      - name: Run the reader tree's Desktop harness
        run: cargo test -p canopi-desktop --test rollback_reader --locked
        env:
          CANOPI_ROLLBACK_FIXTURES: ${{ runner.temp }}/rollback-fixtures
      - name: The Desktop readers wrote no byte
        run: node lane/policy/gate/cli.mjs rollback-fixtures compare "$RUNNER_TEMP/rollback-fixtures" "$RUNNER_TEMP/before.json"
      # The planted-change self-test: over a copy with one Desktop form made unreadable the harness must fail. While the
      # reader tree's session test still carries its expected-fail ignore (canopi-f47t.52.239), nothing reads the copy,
      # which the summary says; once the marker goes, a harness passing over it fails the lane.
      - name: The Desktop lane fails on a planted unreadable change
        run: |
          cp -r "$RUNNER_TEMP/rollback-fixtures" "$CANOPI_ROLLBACK_FIXTURES"
          node lane/policy/gate/cli.mjs rollback-fixtures plant "$CANOPI_ROLLBACK_FIXTURES" desktop
          cargo test -p canopi-desktop --test rollback_reader --locked -- --list --ignored > "$RUNNER_TEMP/ignored.txt"
          if grep -q 'a_session_over_every_frozen_store_fixture_writes_no_byte' "$RUNNER_TEMP/ignored.txt"; then
            echo "::warning::expected-fail (R4 canopi-f47t.52.239): this reader tree's Desktop session test is ignored, so no reader read the planted change"
            echo "PLANTED desktop: held, the reader tree's Desktop session test is still expected-fail (canopi-f47t.52.239)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if cargo test -p canopi-desktop --test rollback_reader --locked; then
            echo "::error::the Desktop readers passed over a planted unreadable change"
            exit 1
          fi
          echo "PLANTED desktop: the readers failed on the planted change, as they must" >> "$GITHUB_STEP_SUMMARY"
        env:
          CANOPI_ROLLBACK_FIXTURES: ${{ runner.temp }}/rollback-planted

  reader-web:
    name: Web reader ${{ needs.resolve.outputs.reader }} in ${{ matrix.engine }} writes no byte
    needs: [resolve, writer]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    # The browsers of the locked @playwright/test (scripts/check_playwright_pins.py holds the tag to it).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: desktop/web
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.reader }}
      - uses: actions/checkout@v7
        with:
          path: lane
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json
      # The Web build compiles the format worker's module first: the reader tree's toolchain with its wasm32 target, and
      # the wasm-bindgen CLI at Cargo.lock's version (canopi-format-wasm/build-wasm.test.ts holds the pin to head's lock).
      # A reader tag whose lock pins another version is refused by its own build-wasm.mjs, naming both. The Playwright
      # image has no C compiler, which the crates' build scripts link with on the host.
      - name: Install the host C toolchain
        run: |
          timeout 3m apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 update -qq
          timeout 5m apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 install -y -qq --no-install-recommends gcc libc6-dev
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown
      # With no argument rustup installs what the reader tree's rust-toolchain.toml pins, its targets included.
      - name: Install the reader tree's Rust toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130
      - name: Install frontend deps
        run: npm ci --no-audit --no-fund
      - name: Build the reader tree's Web Edition
        run: npm run build:web:bundle
      - name: Download the fixture directory
        uses: actions/download-artifact@v8
        with:
          name: rollback-fixtures
          path: ${{ runner.temp }}/rollback-fixtures
      - name: Check the fixture directory
        run: node ../../lane/policy/gate/cli.mjs rollback-fixtures check "$RUNNER_TEMP/rollback-fixtures"
      # The harness compares the profile it seeded with the one the session leaves (a created database or a versioned
      # open included); the fixture directory itself is only read.
      - name: Run the reader tree's Web harness in ${{ matrix.engine }}
        run: npm run test:rollback -- --project=${{ matrix.engine }}
        env:
          CANOPI_ROLLBACK_FIXTURES: ${{ runner.temp }}/rollback-fixtures
          # WebKit refuses a $HOME it does not own, and Actions points the container's at the runner user's.
          HOME: /root
      # The planted-change self-test: the session test over a copy with one Web form made unreadable must fail; its own
      # output directory keeps the first run's report.
      - name: The ${{ matrix.engine }} lane fails on a planted unreadable change
        run: |
          cp -r "$RUNNER_TEMP/rollback-fixtures" "$CANOPI_ROLLBACK_FIXTURES"
          node ../../lane/policy/gate/cli.mjs rollback-fixtures plant "$CANOPI_ROLLBACK_FIXTURES" web
          if npm run test:rollback -- --project=${{ matrix.engine }} --grep "writes no byte" --output=planted-results --reporter=line; then
            echo "::error::the ${{ matrix.engine }} readers passed over a planted unreadable change"
            exit 1
          fi
          echo "PLANTED web ${{ matrix.engine }}: the readers failed on the planted change, as they must" >> "$GITHUB_STEP_SUMMARY"
        env:
          CANOPI_ROLLBACK_FIXTURES: ${{ runner.temp }}/rollback-planted
          HOME: /root
      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rollback-web-${{ matrix.engine }}
          path: desktop/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
