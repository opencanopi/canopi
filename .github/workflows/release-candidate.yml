name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: main
        type: string
      release_version:
        description: Expected version from desktop/tauri.conf.json
        required: true
        type: string
      db_release_tag:
        description: GitHub release tag containing the bundled DB asset
        required: true
        default: canopi-core-db
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.head.outputs.head_sha }}
      tools_sha: ${{ steps.tools.outputs.tools_sha }}
      db_sha256: ${{ steps.db.outputs.db_sha256 }}
      db_asset_name: ${{ steps.schema.outputs.db_asset_name }}
      web_catalog_asset_name: ${{ steps.schema.outputs.web_catalog_asset_name }}
      expected_schema_version: ${{ steps.schema.outputs.expected_schema_version }}
      channel: ${{ steps.channel.outputs.channel }}
      updater: ${{ steps.channel.outputs.updater }}
      windows_installers: ${{ steps.channel.outputs.windows_installers }}
      canopi_association: ${{ steps.identity.outputs.canopi_association }}
    steps:
      # A dispatch runs the copy of this file on its --ref: only main's copy carries main's release tools and the
      # Stable-fix preflight, so every other copy refuses (stable_fix_preflight.py reads this line in a ref's copy).
      - name: Only main's Release Candidate builds a candidate
        if: github.ref != 'refs/heads/main'
        shell: bash
        env:
          BUILD_REF: ${{ inputs.ref }}
        run: |
          echo "::error::This is ${GITHUB_REF}'s copy of release-candidate.yml; build with main's copy: gh workflow run release-candidate.yml --ref main -f ref=${BUILD_REF}"
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          # The Stable-fix preflight reads main's and release/2.0's history.
          fetch-depth: 0

      - id: head
        name: Capture build commit
        shell: bash
        run: |
          set -euo pipefail
          echo "Resolving commit for ref '${{ inputs.ref }}'"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # main's release tools, whatever the dispatch: main's checkout (never the dispatched commit) runs
      # web_release.py and the Stable-fix preflight with the ref's paths as arguments (2.1-M216, 2.1-M215).
      # A stable candidate is `--ref main -f ref=release/2.0`; the preflight fails closed on a ref without main's
      # release interface, naming the port, and on a ref still carrying a copy of this file that runs off main.
      - uses: actions/checkout@v7
        with:
          ref: main
          path: release-tools

      - id: tools
        name: Record main's release tools commit
        shell: bash
        run: |
          set -euo pipefail
          tools_sha="$(git -C release-tools rev-parse HEAD)"
          echo "Release tools: main at $tools_sha" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "tools_sha=$tools_sha" >> "$GITHUB_OUTPUT"

      - name: Stable-fix preflight and release interface (a ref on release/2.0)
        shell: bash
        env:
          BUILD_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor HEAD origin/release/2.0 2>/dev/null \
              && ! git merge-base --is-ancestor HEAD origin/main; then
            python3 -I release-tools/scripts/stable_fix_preflight.py --repo . --ref HEAD --name "$BUILD_REF" --main origin/main
          else
            echo "The ref is not on release/2.0: no Stable-fix preflight."
          fi

      - id: version
        name: Verify release version metadata
        shell: bash
        run: |
          set -euo pipefail
          requested_version="${{ inputs.release_version }}"
          REQUESTED_VERSION="$requested_version" python3 - <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          requested_version = os.environ["REQUESTED_VERSION"]

          def read_json_version(path: str) -> str:
              data = json.loads(Path(path).read_text())
              version = data.get("version")
              if not isinstance(version, str) or not version:
                  raise SystemExit(f"::error::{path} must define a non-empty string version.")
              return version

          def read_package_lock_root_version(path: str) -> str:
              data = json.loads(Path(path).read_text())
              root = data.get("packages", {}).get("")
              version = root.get("version") if isinstance(root, dict) else None
              if not isinstance(version, str) or not version:
                  raise SystemExit(f"::error::{path} packages[''] must define a non-empty string version.")
              return version

          def read_cargo_workspace_version(path: str) -> str:
              text = Path(path).read_text()
              match = re.search(r"(?ms)^\[workspace\.package\]\s*(?P<body>.*?)(?:^\[|\Z)", text)
              if not match:
                  raise SystemExit(f"::error::{path} must define [workspace.package].")
              version_match = re.search(r'(?m)^\s*version\s*=\s*"([^"]+)"\s*$', match.group("body"))
              if not version_match:
                  raise SystemExit(f"::error::{path} [workspace.package] must define version.")
              return version_match.group(1)

          versions = {
              "desktop/tauri.conf.json": read_json_version("desktop/tauri.conf.json"),
              "Cargo.toml [workspace.package]": read_cargo_workspace_version("Cargo.toml"),
              "desktop/web/package.json": read_json_version("desktop/web/package.json"),
              "desktop/web/package-lock.json": read_json_version("desktop/web/package-lock.json"),
              "desktop/web/package-lock.json packages['']": read_package_lock_root_version("desktop/web/package-lock.json"),
          }

          print(f"Requested release version: {requested_version}")
          for source, version in versions.items():
              print(f"{source}: {version}")

          tauri_version = versions["desktop/tauri.conf.json"]
          failed = False
          if tauri_version != requested_version:
              print(
                  f"::error::desktop/tauri.conf.json version '{tauri_version}' does not match workflow input '{requested_version}'.",
                  file=sys.stderr,
              )
              failed = True

          for source, version in versions.items():
              if source == "desktop/tauri.conf.json":
                  continue
              if version != tauri_version:
                  print(
                      f"::error::{source} version '{version}' does not match desktop/tauri.conf.json version '{tauri_version}'.",
                      file=sys.stderr,
                  )
                  failed = True

          if failed:
              raise SystemExit(1)
          PY

      # The channel is the version's pre-release label (2.1-M205): none is stable, beta.<n> is beta. A ref whose
      # tauri.conf.json names no updater public key (a 2.0.x stable fix) builds no updater artifacts; a beta needs one.
      # A beta's Windows build is the NSIS installer only: an MSI version takes no pre-release label (2.1-M27, M55).
      - id: channel
        name: Read the update channel
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee -a "$GITHUB_OUTPUT"
          import json
          import os
          import re
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          match = re.fullmatch(r"\d+\.\d+\.\d+(?:-(beta\.\d+))?", version)
          if not match:
              raise SystemExit(f"::error::{version} is neither a release (2.1.0) nor a beta (2.1.0-beta.1).")
          conf = json.loads(Path("desktop/tauri.conf.json").read_text())
          updater = bool(conf.get("plugins", {}).get("updater", {}).get("pubkey"))
          channel = "beta" if match.group(1) else "stable"
          if channel == "beta" and not updater:
              raise SystemExit("::error::A beta reaches its testers through the updater; this ref has no updater key.")
          print(f"channel={channel}")
          print(f"updater={'true' if updater else 'false'}")
          print("windows_installers=" + json.dumps(["nsis"] if channel == "beta" else ["nsis", "msi"]))
          PY

      # The .canopi association arrived with 2.1 (2.1-Q145); a 2.0.x stable fix's installers declare none, so its
      # smoke installs and starts them and skips only the open-by-association check.
      - id: identity
        name: Read whether the installers open a .canopi
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee -a "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          associations = json.loads(Path("desktop/tauri.conf.json").read_text()).get("bundle", {}).get("fileAssociations", [])
          declared = any("canopi" in association.get("ext", []) for association in associations)
          print(f"canopi_association={'true' if declared else 'false'}")
          PY

      - id: schema
        name: Read expected plant DB schema version
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/species_catalog_contract.py check
          expected_schema_version="$(python3 scripts/species_catalog_contract.py value prepared-schema-version)"
          db_asset_name="$(python3 scripts/species_catalog_contract.py value prepared-db-asset-name)"
          web_catalog_asset_name="$(python3 -I release-tools/scripts/web_release.py catalog-asset-name --root .)"
          echo "Expected bundled DB schema version: $expected_schema_version"
          echo "Compiled bundled DB asset: $db_asset_name"
          echo "Compiled Web catalog asset: $web_catalog_asset_name"
          {
            echo "expected_schema_version=$expected_schema_version"
            echo "db_asset_name=$db_asset_name"
            echo "web_catalog_asset_name=$web_catalog_asset_name"
          } >> "$GITHUB_OUTPUT"

      - name: Download bundled plant DB
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preflight
          echo "Downloading bundled DB '${{ steps.schema.outputs.db_asset_name }}' from release tag '${{ inputs.db_release_tag }}'"
          gh release download "${{ inputs.db_release_tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "${{ steps.schema.outputs.db_asset_name }}" \
            --dir preflight
          db_path="preflight/${{ steps.schema.outputs.db_asset_name }}"
          if [[ ! -s "$db_path" ]]; then
            echo "::error::Bundled DB asset '$db_path' was not downloaded or is empty."
            exit 1
          fi
          echo "Downloaded bundled DB to $db_path"

      - id: db
        name: Verify bundled DB schema and checksum
        shell: bash
        run: |
          set -euo pipefail
          db_path="preflight/${{ steps.schema.outputs.db_asset_name }}"
          expected_schema_version="${{ steps.schema.outputs.expected_schema_version }}"
          python3 scripts/species_catalog_contract.py verify-db --profile prepared "$db_path"
          echo "Bundled DB schema verified at version: $expected_schema_version"
          db_sha256="$(sha256sum "$db_path" | awk '{print $1}')"
          echo "Bundled DB sha256: $db_sha256"
          echo "db_sha256=$db_sha256" >> "$GITHUB_OUTPUT"

      - name: Write preflight summary
        shell: bash
        run: |
          {
            echo "## Release Candidate Preflight"
            echo
            echo "- Ref: \`${{ inputs.ref }}\`"
            echo "- Commit: \`${{ steps.head.outputs.head_sha }}\`"
            echo "- Release version: \`${{ inputs.release_version }}\`"
            echo "- DB tag: \`${{ inputs.db_release_tag }}\`"
            echo "- DB asset: \`${{ steps.schema.outputs.db_asset_name }}\`"
            echo "- Expected DB schema: \`${{ steps.schema.outputs.expected_schema_version }}\`"
            echo "- DB sha256: \`${{ steps.db.outputs.db_sha256 }}\`"
            echo "- Web catalog asset: \`${{ steps.schema.outputs.web_catalog_asset_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: preflight
    # Its Rust caches are restored, never saved: a target the dispatching ref
    # has not packaged builds cold (the Windows app build alone took 26 minutes).
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux packages build on the oldest supported glibc (2.35): the
          # image is also in the Rust cache keys, so no ubuntu-latest build
          # comes back from a cache (canopi-eon8.14.6).
          - os: ubuntu-latest
            container: ubuntu:22.04
            target: x86_64-unknown-linux-gnu
            bundle_args: --bundles deb appimage
            updater: true
          # macOS keeps its unsigned dmg as today, with no updater artifacts (2.1-Q135, Q136).
          - os: macos-14
            target: aarch64-apple-darwin
            bundle_args: ""
            updater: false
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundle_args: ""
            updater: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle_args: ""
            updater: true

    runs-on: ${{ matrix.os }}
    # An empty image (macOS, Windows) runs on the runner itself.
    container: ${{ matrix.container }}
    env:
      # The bundler's linuxdeploy is an AppImage; a container has no FUSE.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}

      # First: the container image has no curl for the Rust toolchain.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-deps

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-${{ matrix.target }}${{ matrix.container && format('-{0}', matrix.container) || '' }}
          cache-on-failure: false
          save-if: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json

      - name: Install frontend deps
        run: npm ci --prefix desktop/web

      - name: Download bundled plant DB
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          asset_name="${{ needs.preflight.outputs.db_asset_name }}"
          download_dir="$(mktemp -d)"
          trap 'rm -rf "$download_dir"' EXIT
          mkdir -p desktop/resources
          echo "Fetching bundled DB '$asset_name' for target '${{ matrix.target }}'"
          gh release download "${{ inputs.db_release_tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$asset_name" \
            --dir "$download_dir"
          downloaded_db_path="$download_dir/$asset_name"
          if [[ ! -s "$downloaded_db_path" ]]; then
            echo "::error::Bundled DB asset '$downloaded_db_path' is missing or empty before packaging target '${{ matrix.target }}'."
            exit 1
          fi
          db_path="desktop/resources/canopi-core.db"
          mv "$downloaded_db_path" "$db_path"
          if [[ ! -s "$db_path" ]]; then
            echo "::error::Bundled DB asset '$db_path' is missing or empty before packaging target '${{ matrix.target }}'."
            exit 1
          fi
          expected_db_sha256="${{ needs.preflight.outputs.db_sha256 }}"
          actual_db_sha256="$(
            DB_PATH="$db_path" node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");

          const hash = crypto.createHash("sha256");
          fs.createReadStream(process.env.DB_PATH)
            .on("data", (chunk) => hash.update(chunk))
            .on("error", (error) => {
              console.error(error);
              process.exit(1);
            })
            .on("end", () => process.stdout.write(hash.digest("hex")));
          NODE
          )"
          if [[ "$actual_db_sha256" != "$expected_db_sha256" ]]; then
            echo "::error::Bundled DB checksum changed after preflight for target '${{ matrix.target }}': expected $expected_db_sha256, found $actual_db_sha256."
            exit 1
          fi
          echo "Bundled DB checksum matches preflight: $actual_db_sha256"

      # The AppImage bundler downloads linuxdeploy, AppRun and linuxdeploy-plugin-appimage unverified, and upstream
      # replaces them in place (linuxdeploy changed under its URL by 2026-10); the bundler uses the copies it finds in
      # its cache, so the release seeds the cache from Canopi's copies on the bundler-tools release, pinned here
      # (2.1-M82). A new tool version is a new pin and a new upload, never a download at build time.
      - name: Pre-seed the AppImage bundler tools
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tools="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$tools"
          gh release download bundler-tools --repo "$GITHUB_REPOSITORY" --dir "$tools" --clobber \
            --pattern linuxdeploy-x86_64.AppImage --pattern AppRun-x86_64 --pattern linuxdeploy-plugin-appimage.AppImage
          cd "$tools"
          sha256sum --check --strict <<'SUMS'
          e762bea85c8eb0d4b3508d46e5c1f037f717d0f9303ae3b4aafc8b04991fa1ef  linuxdeploy-x86_64.AppImage
          f30140a43a0a59e46db21bdefdf749b9e9f2c6946e92afabbacf98b8ae73fb4f  AppRun-x86_64
          49d6a17160675a6bd1781699aae6bdf7692d98552e02a3671d2183d10547842e  linuxdeploy-plugin-appimage.AppImage
          SUMS
          chmod +x linuxdeploy-x86_64.AppImage AppRun-x86_64 linuxdeploy-plugin-appimage.AppImage

      # The sidecar must exist before `tauri build`: build.rs bundles it only
      # when desktop/binaries holds it for the target (the runner's host).
      - uses: ./.github/actions/build-geolibre-cli

      # The locked @tauri-apps/cli devDependency, run from the repository root; never an npx fetch (2.1-M216).
      # macOS runners intermittently refuse the disk image (`hdiutil: create failed - Resource busy`; v2.0.0's
      # candidate, 2026-10-16); a second try reuses the compiled app, so it costs the bundling step only.
      #
      # On Linux and Windows the release overlay turns on the updater artifacts (2.1-M242): the bundler signs each
      # installer with the updater key as it writes it, binding the release version into the signature (tauri-cli
      # 2.12). Only this step reads the key and its password (2.1-Q230). A beta's .deb is repacked so dpkg ranks it
      # below its stable (2.1.0~beta.1 < 2.1.0; the F6 probe saw 2.1.0 over 2.1.0-beta.1 as a downgrade) and signed
      # again. No signCommand until SignPath (2.1-Q124, M210).
      - name: Build Tauri app
        shell: bash
        env:
          UPDATER: ${{ matrix.updater && needs.preflight.outputs.updater == 'true' }}
          CHANNEL: ${{ needs.preflight.outputs.channel }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          BUNDLE_ARGS: ${{ matrix.target == 'x86_64-pc-windows-msvc' && needs.preflight.outputs.channel == 'beta' && '--bundles nsis' || matrix.bundle_args }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ matrix.updater && needs.preflight.outputs.updater == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ matrix.updater && needs.preflight.outputs.updater == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          overlay=()
          if [ "$UPDATER" = true ]; then overlay=(--config .github/tauri-release-updater.json); fi
          # shellcheck disable=SC2086 # BUNDLE_ARGS is a word list
          build() { npm run --prefix desktop/web tauri -- build --target ${{ matrix.target }} $BUNDLE_ARGS "${overlay[@]}" -- --locked; }
          if [ "$RUNNER_OS" = macOS ]; then build || { echo "::warning::bundling failed once; retrying"; sleep 10; build; }; else build; fi
          if [ "$UPDATER" = true ] && [ "$CHANNEL" = beta ] && [ "$RUNNER_OS" = Linux ]; then
            for deb in target/${{ matrix.target }}/release/bundle/deb/*.deb; do
              python3 scripts/release_smoke.py repack-deb "$deb" --version "$RELEASE_VERSION"
              rm -f "$deb.sig"
              npm run --prefix desktop/web tauri -- signer sign --app-version "$RELEASE_VERSION" "$deb"
            done
          fi

      - name: Windows app selects Common Controls v6
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m pip install --quiet pefile
          exe=""
          for name in canopi-desktop.exe Canopi.exe; do
            if [ -f "target/${{ matrix.target }}/release/$name" ]; then exe="target/${{ matrix.target }}/release/$name"; break; fi
          done
          test -n "$exe" || { echo "no Canopi executable under target/${{ matrix.target }}/release" >&2; exit 1; }
          python scripts/check_windows_manifest.py "$exe"

      - name: Packaged sidecar runs from the installed layout
        shell: bash
        run: scripts/smoke-bundled-sidecar.sh ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: canopi-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/**/*.deb
            target/${{ matrix.target }}/release/bundle/**/*.AppImage
            target/${{ matrix.target }}/release/bundle/**/*.dmg
            target/${{ matrix.target }}/release/bundle/**/*.msi
            target/${{ matrix.target }}/release/bundle/**/*.exe
            target/${{ matrix.target }}/release/bundle/**/*.sig
          if-no-files-found: error
          retention-days: 30

  # The Linux packages start on Debian 12 (glibc 2.36, the oldest supported
  # with Ubuntu 22.04): the sidecar runs from the unpacked .deb and AppImage,
  # and the AppImage gets past the loader on the libraries every desktop has.
  linux-floor:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    container: debian:12
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}

      - name: Install the desktop base libraries
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y binutils libdrm2 libegl1 libexpat1 libfontconfig1 libfreetype6 \
            libfribidi0 libgbm1 libgl1 libharfbuzz0b libwayland-client0 libx11-6 libx11-xcb1 libxcb1

      - uses: actions/download-artifact@v8
        with:
          name: canopi-x86_64-unknown-linux-gnu
          path: bundle

      - name: Packaged binaries start on Debian 12
        shell: bash
        run: scripts/smoke-bundled-sidecar.sh x86_64-unknown-linux-gnu bundle

  # The release smoke (ADR 0029 Release safety, 2.1-Q145): each Linux package installs on the oldest supported Ubuntu
  # (22.04) and the newest, opens on the start screen (the real-app suite's spec over tauri-driver, which drives a
  # release build too), and a .canopi opened through the .deb's association loads. The run fails unless the planted
  # run, a truncated download, fails first. The smoke script and the spec are main's release tools at tools_sha
  # (2.1-M216), so a release/2.0 stable fix, whose tree has neither, is smoked the same way; the Design is the build's.
  smoke-linux:
    needs: [preflight, build]
    name: smoke ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    env:
      RELEASE_VERSION: ${{ inputs.release_version }}
      # The runner has no FUSE for the AppImage's own mount.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.tools_sha }}
          path: release-tools

      # webkit2gtk-driver for tauri-driver, a private X server, D-Bus session and window manager as the real-app suite
      # has them, and gio (libglib2.0-bin) to open a file through its association.
      - name: Install the WebKit driver, Xvfb, D-Bus, openbox and gio
        run: sudo apt-get update && sudo apt-get install -y webkit2gtk-driver xvfb dbus dbus-x11 openbox libglib2.0-bin

      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Install tauri-driver 2.1.0
        run: cargo install tauri-driver --version 2.1.0 --locked

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: release-tools/desktop/web/package-lock.json

      - name: Install the release tools' frontend deps
        run: npm ci --prefix release-tools/desktop/web --no-audit --no-fund

      - uses: actions/download-artifact@v8
        with:
          name: canopi-x86_64-unknown-linux-gnu
          path: bundle

      - name: The smoke fails on a planted truncated download
        shell: bash
        run: |
          set +e
          deb="$(find bundle -name '*.deb' | head -n 1)"
          python3 -I release-tools/scripts/release_smoke.py install --planted "$deb"
          if [ $? -eq 0 ]; then echo "::error::the planted run passed: a truncated .deb installed"; exit 1; fi

      - name: Install and start each Linux package and open a Design by its association
        shell: bash
        env:
          CANOPI_ASSOCIATION: ${{ needs.preflight.outputs.canopi_association }}
        run: |
          set -euo pipefail
          deb="$(find bundle -name '*.deb' | head -n 1)"
          appimage="$(find bundle -name '*.AppImage' | head -n 1)"
          design="$RUNNER_TEMP/Smoke garden.canopi"
          cp desktop/web/e2e/fixtures/canvas-base.canopi "$design"
          python3 -I release-tools/scripts/release_smoke.py check-deb "$deb" --version "$RELEASE_VERSION"
          deb_app="$(python3 -I release-tools/scripts/release_smoke.py install "$deb")"
          appimage_app="$(python3 -I release-tools/scripts/release_smoke.py install "$appimage")"
          dbus-run-session -- xvfb-run -a -s '-screen 0 1400x900x24' bash -euo pipefail -c '
            openbox & wm=$!; sleep 2; kill -0 "$wm"
            python3 -I release-tools/scripts/release_smoke.py start-screen "$1"
            python3 -I release-tools/scripts/release_smoke.py start-screen "$2"
            if [ "$CANOPI_ASSOCIATION" = true ]; then
              python3 -I release-tools/scripts/release_smoke.py open-design "$3"
            else
              echo "::notice::these installers declare no .canopi association (a 2.0.x stable fix): no open-design"
            fi' smoke "$deb_app" "$appimage_app" "$design"

  # The Windows installers, each on its own runner: NSIS and, for a stable release, the MSI.
  smoke-windows:
    needs: [preflight, build]
    name: smoke ${{ matrix.installer }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        installer: ${{ fromJSON(needs.preflight.outputs.windows_installers) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.tools_sha }}
          path: release-tools

      - uses: actions/download-artifact@v8
        with:
          name: canopi-x86_64-pc-windows-msvc
          path: bundle

      - name: The smoke fails on a planted truncated download
        shell: bash
        run: |
          set +e
          installer="$(find bundle/${{ matrix.installer }} -type f \( -name '*-setup.exe' -o -name '*.msi' \) | head -n 1)"
          python -I release-tools/scripts/release_smoke.py install --planted "$installer"
          if [ $? -eq 0 ]; then echo "::error::the planted run passed: a truncated installer installed"; exit 1; fi

      - name: Install and start Canopi and open a Design by its association
        shell: bash
        env:
          CANOPI_ASSOCIATION: ${{ needs.preflight.outputs.canopi_association }}
        run: |
          set -euo pipefail
          installer="$(find bundle/${{ matrix.installer }} -type f \( -name '*-setup.exe' -o -name '*.msi' \) | head -n 1)"
          design="$RUNNER_TEMP/Smoke garden.canopi"
          cp desktop/web/e2e/fixtures/canvas-base.canopi "$design"
          app="$(python -I release-tools/scripts/release_smoke.py install "$installer")"
          python -I release-tools/scripts/release_smoke.py start-screen "$app"
          if [ "$CANOPI_ASSOCIATION" = true ]; then
            python -I release-tools/scripts/release_smoke.py open-design "$design"
          else
            echo "::notice::this installer declares no .canopi association (a 2.0.x stable fix): no open-design"
          fi

  # The updater's end-to-end lane (plan Phase 0 F6) is a release check: N-1 to N on the AppImage, the .deb and NSIS.
  # A ref with no updater key (a 2.0.x stable fix) has no updater to check.
  updater-end-to-end:
    needs: preflight
    if: needs.preflight.outputs.updater == 'true'
    uses: ./.github/workflows/updater-e2e.yml
    with:
      ref: ${{ needs.preflight.outputs.head_sha }}

  # The root Web Edition (web.projectcanopi.com) from the same commit, with the Web
  # catalog published beside the DB by scripts/publish-db-release.sh.
  web:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}

      # main's release tools at the commit the preflight recorded, so every job runs one revision of them.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.tools_sha }}
          path: release-tools

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json

      - name: Download and verify the Web catalog
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_NAME: ${{ needs.preflight.outputs.web_catalog_asset_name }}
          DB_RELEASE_TAG: ${{ inputs.db_release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          download_dir="$RUNNER_TEMP/web-catalog"
          mkdir -p "$download_dir"
          gh release download "$DB_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET_NAME" \
            --pattern "$ASSET_NAME.sha256" \
            --dir "$download_dir"
          (cd "$download_dir" && sha256sum --check --strict "$ASSET_NAME.sha256")
          python3 -I release-tools/scripts/web_release.py unpack-catalog --root . \
            --archive "$download_dir/$ASSET_NAME" \
            --output-dir desktop/web/catalog-input

      - name: Install frontend deps
        run: npm ci --prefix desktop/web

      - name: Build the root Web Edition
        working-directory: desktop/web
        run: npm run build:web

      - name: Package and verify the Web Edition archive
        id: archive
        env:
          HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I release-tools/scripts/web_release.py package --dist desktop/web/dist-web \
            --output-dir desktop/web/dist-web-artifacts --version "$RELEASE_VERSION" --commit "$HEAD_SHA"
          archive="desktop/web/dist-web-artifacts/$(python3 -I release-tools/scripts/web_release.py archive-name \
            --version "$RELEASE_VERSION" --commit "$HEAD_SHA")"
          python3 -I release-tools/scripts/web_release.py verify \
            --archive "$archive" \
            --version "$RELEASE_VERSION" \
            --commit "$HEAD_SHA" \
            --output-dir "$RUNNER_TEMP/web-site"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload the Web Edition archive
        uses: actions/upload-artifact@v7
        with:
          name: canopi-web-edition
          path: ${{ steps.archive.outputs.archive }}
          if-no-files-found: error
          retention-days: 30

  # Every lane before it passed or was skipped: a stable fix skips the updater lane, and still reaches its manifest.
  manifest:
    needs: [preflight, build, linux-floor, smoke-linux, smoke-windows, updater-end-to-end, web]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}
          path: source

      # main's release tools at the commit the preflight recorded, so every job runs one revision of them.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.tools_sha }}
          path: release-tools

      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: canopi-*
          path: artifacts

      - name: Generate checksum manifest
        shell: bash
        env:
          BUILD_REF: ${{ inputs.ref }}
          BUILD_VERSION: ${{ inputs.release_version }}
          DB_ASSET_NAME: ${{ needs.preflight.outputs.db_asset_name }}
          DB_RELEASE_TAG: ${{ inputs.db_release_tag }}
          DB_SHA256: ${{ needs.preflight.outputs.db_sha256 }}
          WEB_CATALOG_ASSET_NAME: ${{ needs.preflight.outputs.web_catalog_asset_name }}
          EXPECTED_SCHEMA_VERSION: ${{ needs.preflight.outputs.expected_schema_version }}
          HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
          REPOSITORY: ${{ github.repository }}
          UPDATER: ${{ needs.preflight.outputs.updater }}
        run: |
          set -euo pipefail
          (
            cd artifacts
            find . -type f \( \
              -name '*.deb' -o \
              -name '*.AppImage' -o \
              -name '*.dmg' -o \
              -name '*.msi' -o \
              -name '*.exe' -o \
              -name '*.sig' -o \
              -path './canopi-web-edition/*' \
            \) -print | sort | xargs sha256sum
          ) > SHA256SUMS.txt

          if [[ ! -s SHA256SUMS.txt ]]; then
            echo "::error::No packaged artifacts were found when generating SHA256SUMS.txt."
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = {
              "repository": os.environ["REPOSITORY"],
              "ref": os.environ["BUILD_REF"],
              "head_sha": os.environ["HEAD_SHA"],
              "release_version": os.environ["BUILD_VERSION"],
              "db_release_tag": os.environ["DB_RELEASE_TAG"],
              "db_asset_name": os.environ["DB_ASSET_NAME"],
              "web_catalog_asset_name": os.environ["WEB_CATALOG_ASSET_NAME"],
              "db_sha256": os.environ["DB_SHA256"],
              "expected_db_schema_version": int(os.environ["EXPECTED_SCHEMA_VERSION"]),
              "updater": os.environ["UPDATER"] == "true",
          }
          Path("release-metadata.json").write_text(json.dumps(metadata, indent=2) + "\n")
          PY

      # The channel files this release moves (2.1-M27, M205): generated from the signed installers over the channel
      # files users read today, and verified against the installers under the app's public key. They ride on the draft
      # as channel-*.json; `update_channel.py publish` moves the channels once the release is published (2.1-Q250).
      - name: Generate the channel files
        if: needs.preflight.outputs.updater == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p current
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          gh release download "$latest" --repo "$GITHUB_REPOSITORY" --pattern stable.json --dir current || true
          gh release download beta-channel --repo "$GITHUB_REPOSITORY" --pattern beta.json --dir current || true
          python3 -I release-tools/scripts/update_channel.py generate --version "$RELEASE_VERSION" --artifacts artifacts \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/v$RELEASE_VERSION" --current current --out .
          python3 -I release-tools/scripts/update_channel.py --conf source/desktop/tauri.conf.json verify \
            --version "$RELEASE_VERSION" --channel-dir . --artifacts artifacts

      - name: The channel check fails on a planted unsigned artifact and a missing entry
        if: needs.preflight.outputs.updater == 'true'
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        shell: bash
        run: |
          set -uo pipefail
          check() { python3 -I release-tools/scripts/update_channel.py --conf source/desktop/tauri.conf.json verify \
            --version "$RELEASE_VERSION" --channel-dir "$1" --artifacts "$2"; }
          cp -al artifacts planted-artifacts
          rm "$(find planted-artifacts -name '*.sig' | head -n 1)"
          if check . planted-artifacts; then echo "::error::the planted run passed: an unsigned updater artifact"; exit 1; fi
          mkdir planted-channels
          for file in channel-*.json; do
            python3 -c 'import json, sys; d = json.load(open(sys.argv[1])); d["platforms"].pop(sorted(d["platforms"])[0]); json.dump(d, open(sys.argv[2], "w"))' \
              "$file" "planted-channels/$file"
          done
          if check planted-channels artifacts; then echo "::error::the planted run passed: a missing channel entry"; exit 1; fi
          echo "Both planted channel checks failed, as they must."

      - name: Write manifest summary
        shell: bash
        run: |
          {
            echo "## Release Candidate Artifacts"
            echo
            echo "- Commit: \`${{ needs.preflight.outputs.head_sha }}\`"
            echo "- Version: \`${{ inputs.release_version }}\`"
            echo "- Packaged artifact checksums (desktop and Web): \`SHA256SUMS.txt\`"
            echo "- Bundled DB checksum: \`${{ needs.preflight.outputs.db_sha256 }}\`"
            echo "- Promotion command: \`scripts/promote-release.sh --run-id ${{ github.run_id }} --tag <tag> --title <title>\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release-candidate manifest
        uses: actions/upload-artifact@v7
        with:
          name: canopi-release-candidate-manifest
          path: |
            SHA256SUMS.txt
            release-metadata.json
            channel-*.json
          if-no-files-found: error
          retention-days: 30
