name: PDF production WebView probe

on:
  workflow_dispatch:
  push:
    branches: [main, release/2.0]
    paths:
      - 'desktop/web/src/app/canvas-pdf/**'
      - 'desktop/web/src/components/canvas-pdf/**'
      - 'desktop/web/src/canvas/**'
      - 'desktop/web/package*.json'
      - 'desktop/web/scripts/prepare-pdf-fonts.mjs'
      - 'desktop/web/scripts/pdf-validation/**'
      - 'scripts/pdf-native-webview/**'
      - '.github/workflows/pdf-production-probe.yml'
  pull_request:
    branches: [main, release/2.0]
    paths:
      - 'desktop/web/src/app/canvas-pdf/**'
      - 'desktop/web/src/components/canvas-pdf/**'
      - 'desktop/web/src/canvas/**'
      - 'desktop/web/package*.json'
      - 'desktop/web/scripts/prepare-pdf-fonts.mjs'
      - 'desktop/web/scripts/pdf-validation/**'
      - 'scripts/pdf-native-webview/**'
      - '.github/workflows/pdf-production-probe.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  native:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux
          - os: macos-15
            label: macos-arm64
          - os: macos-15-intel
            label: macos-intel
          - os: windows-latest
            label: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v6
        if: runner.os == 'Windows'
        with:
          dotnet-version: '8.0.x'
      - name: Linux WebView and virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1 xvfb xauth
      - name: Build production worker and preview with packaged fonts
        working-directory: desktop/web
        run: |
          npm ci --ignore-scripts
          npm run build:pdf-validation
      - name: Run Linux WebKitGTK
        if: runner.os == 'Linux'
        run: xvfb-run -a /usr/bin/python3 scripts/pdf-native-webview/run.py production-results/${{ matrix.label }} --fixture desktop/web/dist-pdf-validation --script desktop/web/scripts/pdf-validation/run-native.js
      - name: Run macOS or Windows WebView
        if: runner.os != 'Linux'
        run: python scripts/pdf-native-webview/run.py production-results/${{ matrix.label }} --fixture desktop/web/dist-pdf-validation --script desktop/web/scripts/pdf-validation/run-native.js
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pdf-production-${{ matrix.label }}
          path: production-results/${{ matrix.label }}/
          if-no-files-found: error
          retention-days: 30

  verify:
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils python3-pil
      - uses: actions/download-artifact@v8
        with:
          pattern: pdf-production-*
          path: production-results
      - name: Verify required preview admission
        run: python3 -m unittest discover -s desktop/web/scripts/pdf-validation -p 'test_*.py'
      - name: Independently verify geometry, text and identical page plans
        run: /usr/bin/python3 desktop/web/scripts/pdf-validation/verify.py production-results/*/pdfkit.pdf
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pdf-production-verification
          path: production-results/**/*.verification.json
          if-no-files-found: error
          retention-days: 30
