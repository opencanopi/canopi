name: Supply chain

# The supply-chain lane on main (ADR 0028 Updates and Advisories; 2.1-M57, 2.1-M204, 2.1-M292; design check A17): the
# OSV action (.github/actions/osv-advisories) on every push to main and weekly, since new advisories land in the
# database, not the repository; a pull request changing its inputs runs the same action in Build & Test's supply-chain
# job, with the Renovate config check. The job holds only the checkout and the action, so that job proves every step
# this one runs, and a pull request changing this file runs it. Drift (a new advisory, a stale or expired entry) fails
# these runs; a malformed table or a config differing from it fails every run.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

# Every run has a group of its own, so it always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  advisories:
    name: OSV advisories and npm audit signatures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/osv-advisories
