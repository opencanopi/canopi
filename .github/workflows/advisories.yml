name: Supply chain

# The supply-chain lane on main (ADR 0028 Updates and Advisories; 2.1-M57, 2.1-M204, 2.1-M292; design check A17): the
# OSV action (.github/actions/osv-advisories) on every push to main and weekly, since new advisories land in the
# database, not the repository; a pull request changing its inputs runs the same action in Build & Test's supply-chain
# job, with the Renovate config check. Drift (a new advisory, a stale or expired entry) fails these runs; a malformed
# table or a config differing from it fails every run.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

# Every run has a group of its own, so it always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  advisories:
    name: OSV advisories and npm audit signatures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json

      - uses: ./.github/actions/osv-advisories
