name: Web Edition browsers

# Serves the built Web Edition and drives it in Chromium (stands in for WebView2) and
# WebKit (stands in for WKWebView) with real input; canvas v2 plan section 3.2, canopi-9x95.
# Firefox runs the specs where an engine difference is the subject (2.1-Q196), until F5's full lane.
# Then drives the UI gallery the same way (canopi-f47t.42, plan section 4).
on:
  # Only the Web Edition, the gallery and the version they show (tauri.conf.json, read by About) reach the
  # browsers; Rust, docs and beads do not.
  push:
    branches: [main]
    paths: ['desktop/web/**', '!desktop/web/**/*.md', 'desktop/tauri.conf.json', '.github/workflows/web-edition-browsers.yml']
  pull_request:
    branches: [main]
    paths: ['desktop/web/**', '!desktop/web/**/*.md', 'desktop/tauri.conf.json', '.github/workflows/web-edition-browsers.yml']
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Record the screenshot baselines in the pinned image and upload them as an artifact
        type: boolean
        default: false

# A newer push or PR update cancels the older run of the same ref; main always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  browsers:
    name: ${{ matrix.suite }} ${{ matrix.engine }} ${{ matrix.shard }}
    # A same-repo PR from main runs nothing: the push
    # run already drives its head commit.
    if: >-
      !inputs.update_snapshots &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      github.head_ref != 'main')
    runs-on: ubuntu-latest
    # One job ran canvas then gallery in both engines and passed 30 min on 2026-10-15 (canopi-a407);
    # split by suite, engine and shard (shards split tests, not files: fullyParallel), each job is
    # about a sixth of that.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: canvas, engine: chromium, project: chromium, shard: 1/3 }
          - { suite: canvas, engine: chromium, project: chromium, shard: 2/3 }
          - { suite: canvas, engine: chromium, project: chromium, shard: 3/3 }
          - { suite: canvas, engine: webkit, project: webkit, shard: 1/3 }
          - { suite: canvas, engine: webkit, project: webkit, shard: 2/3 }
          - { suite: canvas, engine: webkit, project: webkit, shard: 3/3 }
          # Firefox drives only the specs the firefox project lists (playwright.config.ts, 2.1-Q196).
          - { suite: canvas, engine: firefox, project: firefox, shard: 1/1 }
          - { suite: gallery, engine: chromium, project: gallery-chromium, shard: 1/1 }
          - { suite: gallery, engine: webkit, project: gallery-webkit, shard: 1/1 }
    # The same image run locally gives the same pixels, so baselines can be recorded with
    # `docker run` on a workstation. Its tag matches the exact @playwright/test version in
    # desktop/web/package.json; a bump changes both and re-records the baselines.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: desktop/web
    steps:
      - uses: actions/checkout@v7

      # Node 22 like every other job (package.json engines ^22.13.0); the image ships Node 24.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json

      - name: Install frontend deps
        run: npm ci --no-audit --no-fund

      # The gallery runs on its own dev server (ui-gallery/) and needs no build.
      - name: Build the Web Edition
        if: matrix.suite == 'canvas'
        run: npm run build:web

      - name: Type-check the browser specs
        if: matrix.suite == 'gallery'
        run: npx tsc -p e2e --noEmit

      - name: Drive ${{ matrix.suite }} in ${{ matrix.engine }} (shard ${{ matrix.shard }})
        run: npx playwright test e2e/${{ matrix.suite }} --project=${{ matrix.project }} --shard=${{ matrix.shard }}
        # Firefox refuses a $HOME it does not own, and Actions points the container's at the runner user's.
        env:
          HOME: /root

      - name: Upload the report and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: web-edition-browsers-${{ matrix.suite }}-${{ matrix.engine }}-${{ strategy.job-index }}
          path: |
            desktop/web/playwright-report/
            desktop/web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  snapshots:
    name: Record the screenshot baselines
    if: ${{ inputs.update_snapshots }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: desktop/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build:web
      - run: npx playwright test e2e/canvas --project=chromium --project=webkit --update-snapshots
      - name: Upload the recorded baselines
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: web-edition-snapshots
          path: desktop/web/e2e/**/*-snapshots/
          if-no-files-found: error
