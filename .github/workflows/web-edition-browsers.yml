name: Web Edition browsers

# Serves the built Web Edition and drives it in Chromium (stands in for WebView2), WebKit (stands in for WKWebView) and
# Firefox with real input, each the whole canvas suite (canvas v2 plan section 3.2, canopi-9x95; 2.1-M214, 2.1-Q84), then
# the UI gallery the same way (canopi-f47t.42, plan section 4). Firefox runs headed under Xvfb (playwright.config.ts).
# The canvas suite's a11y spec writes each engine's axe reports, which the a11y-policy job gates (policy/ratchets/axe.json).
# Every lane has an inverted step: the lane run against a planted blank page must fail, or the job fails (plan:157).
# Build & Test calls it when the gate's web-browsers area is selected (policy/gate/table.ts; design check AR3); a dispatch
# runs it alone. The phone smokes and the baseline recording are phone-smoke.yml's, outside Build & Test.
on:
  workflow_call:
  workflow_dispatch:

# Its own literal group: a called workflow's github.workflow is its caller's name, whose group it would share. A PR
# update cancels that PR's older run. Every other run (a push to main or release/2.0, a manual run) has a group of its
# own, so it always finishes: a shared group would let GitHub drop a pending run whatever cancel-in-progress says.
concurrency:
  group: web-edition-browsers-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browsers:
    name: ${{ matrix.suite }} ${{ matrix.engine }} ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # One job ran canvas then gallery in both engines and passed 30 min on 2026-10-15 (canopi-a407);
    # split by suite, engine and shard (shards split tests, not files: fullyParallel), each job is
    # about a sixth of that.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: canvas, engine: chromium, project: chromium, shard: 1/3 }
          - { suite: canvas, engine: chromium, project: chromium, shard: 2/3 }
          - { suite: canvas, engine: chromium, project: chromium, shard: 3/3 }
          - { suite: canvas, engine: webkit, project: webkit, shard: 1/3 }
          - { suite: canvas, engine: webkit, project: webkit, shard: 2/3 }
          - { suite: canvas, engine: webkit, project: webkit, shard: 3/3 }
          - { suite: canvas, engine: firefox, project: firefox, shard: 1/3 }
          - { suite: canvas, engine: firefox, project: firefox, shard: 2/3 }
          - { suite: canvas, engine: firefox, project: firefox, shard: 3/3 }
          - { suite: gallery, engine: chromium, project: gallery-chromium, shard: 1/1 }
          - { suite: gallery, engine: webkit, project: gallery-webkit, shard: 1/1 }
          - { suite: gallery, engine: firefox, project: gallery-firefox, shard: 1/1 }
    # The same image run locally gives the same pixels, so baselines can be recorded with
    # `docker run` on a workstation. Its tag is the exact @playwright/test version in
    # desktop/web/package-lock.json (scripts/check_playwright_pins.py fails any other); a bump
    # changes both and re-records the baselines only where they diff.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: desktop/web
    steps:
      - uses: actions/checkout@v7

      # Node 24 like every other job (package.json engines ^24.13.0), as in the image.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json

      - name: Install frontend deps
        run: npm ci --no-audit --no-fund

      # The Web build compiles the format worker's module first (`npm run build:format-wasm`, Step 2.0.4): the wasm32
      # target, and the wasm-bindgen CLI at Cargo.lock's wasm-bindgen version, the one build-wasm.mjs accepts.
      - uses: dtolnay/rust-toolchain@1.97.1
        if: matrix.suite == 'canvas'
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        if: matrix.suite == 'canvas'
        with:
          tool: wasm-bindgen@0.2.130

      # The gallery runs on its own dev server (ui-gallery/) and needs no build.
      - name: Build the Web Edition
        if: matrix.suite == 'canvas'
        run: npm run build:web

      # Headed Firefox needs a display at least as large as the largest viewport a spec sets (playwright.config.ts).
      - name: Drive ${{ matrix.suite }} in ${{ matrix.engine }} (shard ${{ matrix.shard }})
        id: drive
        run: ${{ matrix.engine == 'firefox' && 'xvfb-run -a -s "-screen 0 1920x1200x24"' || '' }} npx playwright test e2e/${{ matrix.suite }} --project=${{ matrix.project }} --shard=${{ matrix.shard }}
        # Firefox refuses a $HOME it does not own, and Actions points the container's at the runner user's.
        env:
          HOME: /root

      # The lane's inverted step (plan:157): against a blank page the accessibility tree check expects itself to fail
      # (e2e/canvas/a11y.spec.ts), so this run passes only when the check ran and failed; no matching test, a spec that
      # does not load or the check passing on the blank page fails it. Its own output directory keeps the suite's
      # test-results/, which holds the axe reports.
      - name: The ${{ matrix.engine }} lane fails on a planted blank page
        if: matrix.suite == 'canvas' && matrix.shard == '1/3'
        run: ${{ matrix.engine == 'firefox' && 'xvfb-run -a -s "-screen 0 1920x1200x24"' || '' }} npx playwright test e2e/canvas/a11y.spec.ts --project=${{ matrix.project }} --grep "start-screen keeps its accessibility tree" --output=planted-results --reporter=line
        env:
          HOME: /root
          CANOPI_E2E_PLANTED_PAGE: about:blank

      # The shard's mark: its test step's outcome, so a report the a11y-policy job misses names the shard that did not
      # pass its tests or never got here (policy/adapters/axe.mjs; canopi-f47t.52.240).
      - name: Mark the shard's axe reports
        if: ${{ !cancelled() && matrix.suite == 'canvas' }}
        env:
          ENGINE: ${{ matrix.engine }}
          SHARD: ${{ matrix.shard }}
          OUTCOME: ${{ steps.drive.outcome }}
        run: |
          mkdir -p test-results/a11y/shards
          printf '{"engine":"%s","shard":"%s","outcome":"%s"}\n' "$ENGINE" "$SHARD" "$OUTCOME" \
            > "test-results/a11y/shards/$ENGINE-${SHARD%/*}-of-${SHARD#*/}.json"

      # Each shard holds part of the a11y spec's tests; the a11y-policy job merges every shard's reports.
      - name: Upload the axe reports
        if: ${{ !cancelled() && matrix.suite == 'canvas' }}
        uses: actions/upload-artifact@v7
        with:
          name: a11y-${{ matrix.engine }}-${{ strategy.job-index }}
          path: desktop/web/test-results/a11y/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the report and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: web-edition-browsers-${{ matrix.suite }}-${{ matrix.engine }}-${{ strategy.job-index }}
          path: |
            desktop/web/playwright-report/
            desktop/web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # The format worker in the WebDriver engines Playwright does not drive (Step 2.0.4 R1-1, canopi-f47t.52.270; design
  # check §5b R1): WebKitGTK, through WebKitWebDriver and MiniBrowser on ubuntu-22.04 (Desktop's Linux floor), and Edge,
  # WebView2's engine, through the image's msedgedriver. e2e/canvas/format-core-probe.spec.ts's WebDriver test runs
  # beside the chromium project, which serves dist-web; its inverted step must fail against a driver that is not there.
  format-core-engines:
    name: format worker ${{ matrix.engine }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: webkitgtk, os: ubuntu-22.04 }
          - { engine: edge, os: windows-latest }
    defaults:
      run:
        shell: bash
        working-directory: desktop/web
    env:
      CANOPI_FORMAT_PROBE_WEBDRIVER: http://127.0.0.1:4444
    steps:
      - uses: actions/checkout@v7

      - name: Install WebKitGTK's WebDriver and Xvfb
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-deps
        with:
          packages: xvfb webkit2gtk-driver

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130

      - name: Install frontend deps and Playwright's Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright install chromium

      - name: Build the Web Edition
        run: npm run build:web:bundle

      # The driver's browser and capabilities: MiniBrowser from this WebKitGTK's packages, or the image's Edge headless.
      - name: Choose the driver and its capabilities
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            browser="$(dpkg -L libwebkit2gtk-4.1-0 webkit2gtk-driver 2>/dev/null | grep '/MiniBrowser$' | head -n 1 || true)"
            if [ -z "$browser" ]; then echo "::error::no MiniBrowser in this WebKitGTK's packages"; exit 1; fi
            echo "CANOPI_FORMAT_PROBE_DRIVER=WebKitWebDriver" >> "$GITHUB_ENV"
            printf 'CANOPI_FORMAT_PROBE_CAPABILITIES={"webkitgtk:browserOptions":{"binary":"%s","args":["--automation"]}}\n' "$browser" >> "$GITHUB_ENV"
          else
            echo "CANOPI_FORMAT_PROBE_DRIVER=$(cygpath -u "$EDGEWEBDRIVER")/msedgedriver.exe" >> "$GITHUB_ENV"
            echo 'CANOPI_FORMAT_PROBE_CAPABILITIES={"browserName":"MicrosoftEdge","ms:edgeOptions":{"args":["--headless=new"]}}' >> "$GITHUB_ENV"
          fi

      - name: Drive the format worker in ${{ matrix.engine }}
        run: |
          set -euo pipefail
          run='"$CANOPI_FORMAT_PROBE_DRIVER" --port=4444 & driver=$!; trap "kill $driver" EXIT; sleep 3
            npx playwright test e2e/canvas/format-core-probe.spec.ts --project=chromium --grep "WebDriver engine" --reporter=line'
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a bash -euo pipefail -c "$run"; else bash -euo pipefail -c "$run"; fi

      # The lane's inverted step: with no driver at the URL the test must fail, so a pass above is never a skip.
      - name: The ${{ matrix.engine }} lane fails with no driver
        env:
          CANOPI_FORMAT_PROBE_WEBDRIVER: http://127.0.0.1:1
        run: |
          if npx playwright test e2e/canvas/format-core-probe.spec.ts --project=chromium --grep "WebDriver engine" --reporter=line --output=planted-results; then
            echo "::error::the WebDriver test passed with no driver"
            exit 1
          fi

  a11y-policy:
    name: axe ratchet (three engines)
    needs: browsers
    # Runs whatever the browser jobs' outcome: a missing or partial report fails it closed (policy/adapters/axe.mjs),
    # naming the shards that did not pass their tests.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The pinned image has Playwright's Chromium, which runs axe-core over the planted page.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: desktop/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json
      - name: Install frontend deps
        run: npm ci --no-audit --no-fund
      - name: Download every engine's axe reports
        uses: actions/download-artifact@v7
        with:
          pattern: a11y-*
          merge-multiple: true
          path: desktop/web/test-results/a11y/
      # System config: the planted cases run git with a decoy HOME (check.mjs asGitHook), which drops a global one.
      - name: Trust the workspace for the planted cases
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"
      # policy/gate/table.ts's web-browsers area: the axe family's self-test and check (the browser jobs above are its
      # CI-only check).
      - name: The web-browsers row
        working-directory: .
        run: node policy/gate/cli.mjs full --area web-browsers
        env:
          CANOPI_SKIP_BUNDLED_DB: 1
