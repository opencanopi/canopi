name: Web Edition browsers

# Serves the built Web Edition and drives it in Chromium (stands in for WebView2), WebKit (stands in for WKWebView) and
# Firefox with real input, each the whole canvas suite (canvas v2 plan section 3.2, canopi-9x95; 2.1-M214, 2.1-Q84), then
# the UI gallery the same way (canopi-f47t.42, plan section 4). Firefox runs headed under Xvfb (playwright.config.ts).
# The canvas suite's a11y spec writes each engine's axe reports, which the a11y-policy job gates (policy/ratchets/axe.json).
# Then the phone smoke (ADR 0029 Platform matrix): Safari in iPhone and iPad simulators, Chrome on an Android emulator.
# Every lane has an inverted step: the lane run against a planted blank page must fail, or the job fails (plan:157).
on:
  # Only the Web Edition, the gallery, the version they show (tauri.conf.json, read by About) and the policy checker
  # that gates the axe reports reach the browsers; Rust, docs and beads do not.
  push:
    branches: [main, release/2.0]
    paths: ['desktop/web/**', '!desktop/web/**/*.md', 'desktop/tauri.conf.json', 'policy/**', '.github/workflows/web-edition-browsers.yml']
  pull_request:
    branches: [main, release/2.0]
    paths: ['desktop/web/**', '!desktop/web/**/*.md', 'desktop/tauri.conf.json', 'policy/**', '.github/workflows/web-edition-browsers.yml']
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Record the screenshot baselines in the pinned image and upload them as an artifact
        type: boolean
        default: false

# A PR update cancels that PR's older run. Every other run (a push to main or release/2.0, a manual run) has a group of
# its own, so it always finishes: a shared group would let GitHub drop a pending run whatever cancel-in-progress says.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browsers:
    name: ${{ matrix.suite }} ${{ matrix.engine }} ${{ matrix.shard }}
    # A same-repo PR from main runs nothing: the push
    # run already drives its head commit.
    if: >-
      !inputs.update_snapshots &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      github.head_ref != 'main')
    runs-on: ubuntu-latest
    # One job ran canvas then gallery in both engines and passed 30 min on 2026-10-15 (canopi-a407);
    # split by suite, engine and shard (shards split tests, not files: fullyParallel), each job is
    # about a sixth of that.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: canvas, engine: chromium, project: chromium, shard: 1/3 }
          - { suite: canvas, engine: chromium, project: chromium, shard: 2/3 }
          - { suite: canvas, engine: chromium, project: chromium, shard: 3/3 }
          - { suite: canvas, engine: webkit, project: webkit, shard: 1/3 }
          - { suite: canvas, engine: webkit, project: webkit, shard: 2/3 }
          - { suite: canvas, engine: webkit, project: webkit, shard: 3/3 }
          - { suite: canvas, engine: firefox, project: firefox, shard: 1/3 }
          - { suite: canvas, engine: firefox, project: firefox, shard: 2/3 }
          - { suite: canvas, engine: firefox, project: firefox, shard: 3/3 }
          - { suite: gallery, engine: chromium, project: gallery-chromium, shard: 1/1 }
          - { suite: gallery, engine: webkit, project: gallery-webkit, shard: 1/1 }
          - { suite: gallery, engine: firefox, project: gallery-firefox, shard: 1/1 }
    # The same image run locally gives the same pixels, so baselines can be recorded with
    # `docker run` on a workstation. Its tag is the exact @playwright/test version in
    # desktop/web/package-lock.json (scripts/check_playwright_pins.py fails any other); a bump
    # changes both and re-records the baselines only where they diff.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: desktop/web
    steps:
      - uses: actions/checkout@v7

      # Node 24 like every other job (package.json engines ^24.13.0), as in the image.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json

      - name: Install frontend deps
        run: npm ci --no-audit --no-fund

      # The gallery runs on its own dev server (ui-gallery/) and needs no build.
      - name: Build the Web Edition
        if: matrix.suite == 'canvas'
        run: npm run build:web

      - name: Type-check the browser specs
        if: matrix.suite == 'gallery'
        run: npm run typecheck -- -p e2e

      # Headed Firefox needs a display at least as large as the largest viewport a spec sets (playwright.config.ts).
      - name: Drive ${{ matrix.suite }} in ${{ matrix.engine }} (shard ${{ matrix.shard }})
        run: ${{ matrix.engine == 'firefox' && 'xvfb-run -a -s "-screen 0 1920x1200x24"' || '' }} npx playwright test e2e/${{ matrix.suite }} --project=${{ matrix.project }} --shard=${{ matrix.shard }}
        # Firefox refuses a $HOME it does not own, and Actions points the container's at the runner user's.
        env:
          HOME: /root

      # The lane's inverted step (plan:157): against a blank page the accessibility tree check expects itself to fail
      # (e2e/canvas/a11y.spec.ts), so this run passes only when the check ran and failed; no matching test, a spec that
      # does not load or the check passing on the blank page fails it. Its own output directory keeps the suite's
      # test-results/, which holds the axe reports.
      - name: The ${{ matrix.engine }} lane fails on a planted blank page
        if: matrix.suite == 'canvas' && matrix.shard == '1/3'
        run: ${{ matrix.engine == 'firefox' && 'xvfb-run -a -s "-screen 0 1920x1200x24"' || '' }} npx playwright test e2e/canvas/a11y.spec.ts --project=${{ matrix.project }} --grep "start-screen keeps its accessibility tree" --output=planted-results --reporter=line
        env:
          HOME: /root
          CANOPI_E2E_PLANTED_PAGE: about:blank

      # Each shard holds part of the a11y spec's tests; the a11y-policy job merges every shard's reports.
      - name: Upload the axe reports
        if: ${{ !cancelled() && matrix.suite == 'canvas' }}
        uses: actions/upload-artifact@v7
        with:
          name: a11y-${{ matrix.engine }}-${{ strategy.job-index }}
          path: desktop/web/test-results/a11y/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the report and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: web-edition-browsers-${{ matrix.suite }}-${{ matrix.engine }}-${{ strategy.job-index }}
          path: |
            desktop/web/playwright-report/
            desktop/web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  a11y-policy:
    name: axe ratchet (three engines)
    needs: browsers
    # Runs whatever the browser jobs' outcome: a missing or partial report fails it closed (policy/adapters/axe.mjs).
    if: >-
      !cancelled() && !inputs.update_snapshots &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      github.head_ref != 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The pinned image has Playwright's Chromium, which runs axe-core over the planted page.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: desktop/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Download every engine's axe reports
        uses: actions/download-artifact@v7
        with:
          pattern: a11y-*
          merge-multiple: true
          path: desktop/web/test-results/a11y/
      - name: The axe family's self-test and check
        run: |
          # System config: the planted cases run git with a decoy HOME (check.mjs asGitHook), which drops a global one.
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          npm run test:policies:a11y
        env:
          CANOPI_SKIP_BUNDLED_DB: 1

  ios:
    name: iOS ${{ matrix.device }} (Safari, simulator)
    if: >-
      !inputs.update_snapshots &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      github.head_ref != 'main')
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The phone layout and the tablet layout (ADR 0029:26).
        device: [iPhone, iPad]
    defaults:
      run:
        shell: bash
        working-directory: desktop/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build:web
      - name: Serve the Web Edition
        run: |
          nohup npx vite preview --mode web --port 4174 --strictPort > "$RUNNER_TEMP/preview.log" 2>&1 &
          for _ in $(seq 60); do curl -fsS http://localhost:4174/app/web.html > /dev/null && exit 0; sleep 2; done
          echo "::error::vite preview did not answer"; exit 1
      # A simulator that does not boot fails the job; it never skips (plan:181).
      - name: Boot the newest ${{ matrix.device }} simulator
        run: |
          read -r udid version name < <(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              # com.apple.CoreSimulator.SimRuntime.iOS-26-5 is iOS 26.5, written the way the XCUITest driver reads it.
              return runtime.rsplit(".", 1)[-1].removeprefix("iOS-").replace("-", ".", 1)
          runtimes = (k for k in devices if ".SimRuntime.iOS-" in k)
          for runtime in sorted(runtimes, key=lambda k: [int(p) for p in version(k).split(".") if p.isdigit()], reverse=True):
              for device in devices[runtime]:
                  if device["name"].startswith(sys.argv[1]):
                      print(device["udid"], version(runtime), device["name"]); sys.exit()
          ' "${{ matrix.device }}")
          if [ -z "${udid:-}" ]; then echo "::error::no ${{ matrix.device }} simulator on this runner"; exit 1; fi
          xcrun simctl bootstatus "$udid" -b
          echo "Booted $name, iOS $version, $udid"
          echo "CANOPI_IOS_DEVICE=$name" >> "$GITHUB_ENV"
          echo "CANOPI_IOS_VERSION=$version" >> "$GITHUB_ENV"
          echo "CANOPI_IOS_UDID=$udid" >> "$GITHUB_ENV"
      # Safari is driven through Appium's XCUITest driver, not safaridriver, whose fixed ~34 s connect wait hosted
      # runners exceed (2.1-Q247). Both pinned exactly, each at least two weeks old when pinned: appium 3.8.0
      # (2026-09-24), appium-xcuitest-driver 12.17.3 (2026-10-12). Installed here, not in package.json: only this job
      # needs them.
      - name: Install Appium and the XCUITest driver
        run: |
          npm install --global --no-audit --no-fund appium@3.8.0
          appium driver install xcuitest@12.17.3
          appium --version
          appium driver list --installed
      # WebDriverAgent is built before the first session, so a build failure is reported as one, its log uploaded, and
      # the session starts with the build already done instead of spending its launch wait on xcodebuild.
      - name: Build WebDriverAgent for the simulator
        timeout-minutes: 20
        run: |
          if ! appium driver run xcuitest build-wda --name "$CANOPI_IOS_DEVICE" --sdk "$CANOPI_IOS_VERSION" > "$RUNNER_TEMP/wda-build.log" 2>&1; then
            tail -n 80 "$RUNNER_TEMP/wda-build.log"
            echo "::error::WebDriverAgent did not build for $CANOPI_IOS_DEVICE (iOS $CANOPI_IOS_VERSION)"; exit 1
          fi
      - name: Start Appium
        run: |
          nohup appium --address 127.0.0.1 --port 4723 --log-timestamp --log "$RUNNER_TEMP/appium.log" > /dev/null 2>&1 &
          for _ in $(seq 60); do curl -fsS http://127.0.0.1:4723/status > /dev/null && exit 0; sleep 1; done
          echo "::error::Appium did not answer on port 4723"; exit 1
      # No retry anywhere in the lane: a session that fails to start, even once, fails the job (plan:181).
      - run: npm run test:ios
      - name: The iOS lane fails on a planted blank page
        run: |
          set -o pipefail
          if CANOPI_E2E_PLANTED_PAGE=about:blank npm run test:ios 2>&1 | tee "$RUNNER_TEMP/test-ios-planted.log"; then
            echo "::error::the iOS smoke passed on a blank page: it cannot fail"; exit 1
          fi
          # Only the smoke's own failure counts: a session that never started proves nothing about the blank page.
          if grep -q 'Could not create a session' "$RUNNER_TEMP/test-ios-planted.log"; then
            echo "::error::Appium created no session for the planted page"; exit 1
          fi
      - name: Upload the logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-${{ matrix.device }}
          # The preview, WebDriverAgent build, Appium server and smoke logs and the failed test's screenshot.
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/ios-failure-*.png
          if-no-files-found: ignore
          retention-days: 14

  android:
    name: Android (Chrome, emulator)
    if: >-
      !inputs.update_snapshots &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      github.head_ref != 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop/web
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build:web
      - name: Serve the Web Edition
        run: |
          nohup npx vite preview --mode web --port 4174 --strictPort > "$RUNNER_TEMP/preview.log" 2>&1 &
          for _ in $(seq 60); do curl -fsS http://localhost:4174/app/web.html > /dev/null && exit 0; sleep 2; done
          echo "::error::vite preview did not answer"; exit 1
      # An emulator that does not boot fails this step and the job; it never skips (plan:181).
      - name: Smoke the Web Edition in Chrome on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: desktop/web
          script: |
            adb reverse tcp:4174 tcp:4174
            npm run test:android
            sh e2e/phones/android/inverted.sh
      - name: Upload the logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore
          retention-days: 14

  snapshots:
    name: Record the screenshot baselines
    if: ${{ inputs.update_snapshots }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: desktop/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build:web
      # Pixels and ARIA snapshots in the three engines; headed Firefox under Xvfb (playwright.config.ts).
      - run: xvfb-run -a -s "-screen 0 1920x1200x24" npx playwright test e2e/canvas --project=chromium --project=webkit --project=firefox --update-snapshots
        env:
          HOME: /root
      - name: Upload the recorded baselines
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: web-edition-snapshots
          path: desktop/web/e2e/**/*-snapshots/
          if-no-files-found: error
