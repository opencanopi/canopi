name: Seed lane

# Every gate runs the tests from pinned seeds (vite.config.ts, src/__tests__/support/fast-check-setup.ts, property_config() in grid.rs), so a
# gate is deterministic. This lane runs them from random seeds and prints each one, to find order dependence and
# property failures the pinned seeds miss (ADR 0028 Flakes and Fixed seeds, 2.1-M67, 2.1-M203, 2.1-M234). It is not a
# required check: a red run names its seeds in the job summary, and a failing seed becomes a regression case
# (fc-regressions.json, a .proptest-regressions file) or a bead (2.1-Q242).
#
# Each lane has a planted job on the same triggers that runs the lane's own command over a planted failure at a seed
# recorded as failing, and passes only when the lane exits non-zero and prints that seed. The planted failures fail at
# their seed only (the frontend one at one shuffle order of 40,320), so a lane that stops passing its seed on goes red
# there. No workflow_dispatch input:
# GitHub dispatches only workflows already on the default branch, so the lane's PR could not run one.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 2 * * *'

# A PR update cancels that PR's older run; each nightly run has a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# An explicit bash runs with pipefail, so `lane | tee log || status=$?` keeps the lane's exit status, not tee's.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CANOPI_SKIP_BUNDLED_DB: "1"

jobs:
  frontend:
    name: Frontend, random seeds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json
      - name: Install frontend deps
        run: npm ci --prefix desktop/web
      # test:seed-lane picks CANOPI_TEST_SEED (shuffle order) and CANOPI_FC_SEED (fast-check) at random and prints them.
      - name: Whole suite from random seeds
        working-directory: desktop/web
        run: |
          status=0
          npm run test:seed-lane 2>&1 | tee "$RUNNER_TEMP/seed-lane.log" || status=$?
          seeds=$(grep -m1 -oE 'CANOPI_TEST_SEED=[0-9]+ CANOPI_FC_SEED=[0-9]+' "$RUNNER_TEMP/seed-lane.log")
          {
            echo "Seeds: \`$seeds\`"
            if [ "$status" -ne 0 ]; then
              echo
              echo "Replay with \`$seeds npm run test:seed-lane\` in desktop/web. A fast-check failure prints its"
              echo "fc-regressions.json entry; an order-dependent test is fixed at its cause or filed as a bead."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  planted:
    name: Frontend lane, planted order dependence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json
      - name: Install frontend deps
        run: npm ci --prefix desktop/web
      # policy/fixtures/seed-lane/order-dependent.test.ts fails in seed 3's order of its eight tests only.
      - name: The lane fails a planted order-dependent test and prints its seed
        working-directory: desktop/web
        env:
          CANOPI_TEST_SEED: "3"
        run: |
          status=0
          npm run test:seed-lane -- --dir ../../policy/fixtures/seed-lane 2>&1 | tee "$RUNNER_TEMP/planted.log" || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::The seed lane passed a planted order-dependent test at its failing seed"
            exit 1
          fi
          grep -qE '^CANOPI_TEST_SEED=3 CANOPI_FC_SEED=[0-9]+$' "$RUNNER_TEMP/planted.log" || {
            echo "::error::The seed lane failed without printing its seed"
            exit 1
          }

  # One step serves the lane and its planted failure: the matrix entry names the crate and, for the planted one, the seed.
  proptest:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Property tests, random seed
            target: -p canopi-desktop --lib
            planted: false
          # policy/fixtures/seed-lane/proptest (not a workspace member) holds a property that fails at seed 3 only.
          - name: Property lane, planted failure
            target: --manifest-path policy/fixtures/seed-lane/proptest/Cargo.toml --lib
            seed: "3"
            planted: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ !matrix.planted }}
        with:
          shared-key: test
          cache-on-failure: false
          save-if: false
      - name: Install Linux dependencies
        if: ${{ !matrix.planted }}
        uses: ./.github/actions/install-linux-deps
      # property_config() takes the seed from PROPTEST_RNG_SEED only when it is set; the lane sets a random one. A
      # filter that matches no test fails, so a renamed or moved `properties` module cannot leave the lane testing nothing.
      - name: Property tests from a random seed
        id: lane
        continue-on-error: ${{ matrix.planted }}
        env:
          PROPTEST_RNG_SEED: ${{ matrix.seed }}
          TARGET: ${{ matrix.target }}
        run: |
          seed=${PROPTEST_RNG_SEED:-$(od -An -N8 -tu8 /dev/urandom | tr -d ' ')}
          echo "PROPTEST_RNG_SEED=$seed" | tee "$RUNNER_TEMP/proptest.log"
          echo "Seed: \`PROPTEST_RNG_SEED=$seed\`" >> "$GITHUB_STEP_SUMMARY"
          status=0
          # shellcheck disable=SC2086 # TARGET holds several cargo arguments.
          PROPTEST_RNG_SEED=$seed cargo test --locked $TARGET -- properties:: 2>&1 | tee -a "$RUNNER_TEMP/proptest.log" || status=$?
          ran=$(grep -oE '^test result: [A-Za-z]+\. [0-9]+ passed; [0-9]+ failed' "$RUNNER_TEMP/proptest.log" | awk '{ n += $4 + $6 } END { print n + 0 }')
          if [ "$status" -eq 0 ] && [ "$ran" -eq 0 ]; then
            echo "::error::The property lane ran no test: no test matches properties::"
            exit 1
          fi
          exit "$status"
      # A failing case is written beside its module; commit it as a regression case, or file a bead.
      - name: Upload proptest regressions
        if: ${{ failure() && !matrix.planted }}
        uses: actions/upload-artifact@v7
        with:
          name: proptest-regressions
          path: desktop/src/**/*.proptest-regressions
          if-no-files-found: ignore
      - name: The lane failed the planted property at its seed and printed the seed
        if: ${{ matrix.planted }}
        env:
          OUTCOME: ${{ steps.lane.outcome }}
        run: |
          if [ "$OUTCOME" != failure ]; then
            echo "::error::The property lane passed a planted property at the one seed it fails at"
            exit 1
          fi
          grep -qE '^test properties::fails_at_seed_three \.\.\. FAILED$' "$RUNNER_TEMP/proptest.log" || {
            echo "::error::The property lane failed, but not on the planted property"
            exit 1
          }
          grep -qx 'PROPTEST_RNG_SEED=3' "$RUNNER_TEMP/proptest.log" || {
            echo "::error::The property lane failed without printing its seed"
            exit 1
          }
