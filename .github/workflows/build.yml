name: Build & Test

on:
  push:
    # Work lands through PRs into main (AGENTS.md), and stable fixes into release/2.0 until 2.1.0
    # (docs/guides/native-and-release.md#stable-fixes); both branches run everything.
    branches: [main, release/2.0]
  pull_request:
    branches: [main, release/2.0]

# A PR update cancels that PR's older run. Every push to main or release/2.0 has a group of its own, so it always
# finishes: a shared group would let GitHub drop a pending run whatever cancel-in-progress says.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Rust caches are saved only from main, whose caches every PR can restore;
  # PR refs restore without adding copies.
  SAVE_RUST_CACHE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
  CANOPI_CORE_DB_RELEASE_TAG: canopi-core-db

jobs:
  # Docs, bead and design-board changes run only the docs checks. On a PR into
  # main or release/2.0, the Rust-side jobs (Rust lint and tests, LiDAR lanes,
  # platform tests, installers) run when a Rust-side path changed and the
  # frontend tests and builds when a frontend or Rust-side path changed (Rust
  # generates the frontend's contracts); a push and an unknown base run all.
  # A same-repo PR from main runs nothing: the push run already checks its head.
  changes:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      github.head_ref != 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      PR_RUN: ${{ github.event_name == 'pull_request' }}
    outputs:
      code: ${{ steps.diff.outputs.code }}
      rust: ${{ steps.diff.outputs.rust }}
      frontend: ${{ steps.diff.outputs.frontend }}
      packaging: ${{ steps.packaging.outputs.matrix }}
      platforms: ${{ steps.packaging.outputs.platforms }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # A push diffs from the head of the branch's last successful push run, not
      # from `before`: the previous push's run may have failed or still be running
      # beside this one, so a docs-only push would otherwise skip that push's
      # unproven code. None found: run everything.
      - id: base
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            sha="$PR_BASE"
          else
            sha="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --branch "$GITHUB_REF_NAME" \
              --event push --status success --limit 1 --json headSha --jq '.[0].headSha // ""')" || sha=""
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      # Rust-side: Rust sources and manifests, the toolchain, shared contracts,
      # the desktop shell outside desktop/web/, the scripts Rust or packaging
      # reads, the npm manifests (the Tauri CLI), the web fixtures Rust tests
      # read, the web files that call invoke() (native_command_policy checks
      # every command is still invoked; keep this list in step), build.yml with its actions,
      # and policy/, whose push-lane families run clippy (both sides run its checker).
      - id: diff
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          docs_paths='^(docs/|\.beads/|\.interface-design/)|\.md$'
          # Not docs: both editions ship the generated root file and
          # third-party-notices.test.ts reads it.
          notices_paths='^THIRD_PARTY_NOTICES\.md$'
          rust_paths='\.rs$|(^|/)Cargo\.toml$|^(Cargo\.lock|rust-toolchain\.toml|clippy\.toml|deny\.toml)$|^(\.cargo|common-types|bindings-gen|desktop)/|^\.github/(workflows/build\.yml|actions/|tauri-branch-nsis\.json)|^scripts/(build-geolibre-cli\.sh|smoke-bundled-sidecar\.sh|check_windows_manifest\.py|schema-contract\.json|species_catalog_contract\.py|species_search_normalization\.py|web_catalog_artifact_contract\.py)$|^policy/'
          web_rust_paths='^desktop/web/(package(-lock)?\.json$|src/maplibre/raster-display/fixtures/|src/ipc/|src/app/canvas-pdf/platform\.desktop\.ts$|src/app/shell/bootstrap\.ts$)'
          # The mutation and perf workflows: policy-config-wiring.test.ts reads them.
          frontend_paths='^desktop/web/|^\.github/workflows/(build|mutation|performance)\.yml$|^THIRD_PARTY_NOTICES\.md$|^scripts/web_release(_package)?\.py$|^about\.(toml|hbs)$|^scripts/(generate_notices\.mjs|notices-hand-rows\.json)$|^policy/'
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            code=true rust=true frontend=true
          else
            all="$(git diff --no-renames --name-only "$BASE" "$GITHUB_SHA")"
            changed="$({ grep -vE "$docs_paths" <<<"$all"; grep -E "$notices_paths" <<<"$all"; } || true)"
            code=false
            if [ -n "$changed" ]; then code=true; fi
            rust=$code frontend=$code
            if [ "$PR_RUN" = true ]; then
              outside_web="$(grep -vE '^desktop/web/' <<<"$changed" || true)"
              rust=false frontend=false
              # scripts/gate.py's areas (2.1-M198) select too; the path lists above keep the inputs no gate area
              # names yet (F3c moves the per-area jobs onto `gate.py full --area`).
              sel="$(python3 scripts/gate.py areas --base "$BASE")"
              has() { jq -e --arg a "$1" '.selected | index($a) != null' >/dev/null <<<"$sel"; }
              if has rust || has tauri-command || has shared-contracts || has species-catalog \
                || grep -qE "$rust_paths" <<<"$outside_web" || grep -qE "$web_rust_paths" <<<"$changed"; then rust=true; fi
              if has frontend || grep -qE "$frontend_paths" <<<"$changed"; then frontend=true; fi
            fi
          fi
          { echo "code=$code"; echo "rust=$rust"; echo "frontend=$frontend"; } >> "$GITHUB_OUTPUT"
      # PRs package Linux and Apple silicon only, unless they
      # change a packaging input (Cargo manifests and toolchain, build script,
      # Windows app manifest, icons, Tauri config, the sidecar and its smoke,
      # the Windows manifest check, npm manifests, build.yml and its actions);
      # then, like pushes to main and Release Candidate, all four.
      # PRs build one installer per OS: Linux .deb (as everywhere)
      # and Windows NSIS only, the one the sidecar smoke unpacks; no MSI.
      - id: packaging
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          windows_bundles=""
          # LZMA took 13.5 of the Windows job's 24 min on 2026-10-14 for a 291 MiB installer; a PR
          # checks that the installer builds and its sidecar runs, so zlib is enough. Release Candidate keeps LZMA.
          if [ "$PR_RUN" = true ]; then windows_bundles="--bundles nsis --config .github/tauri-branch-nsis.json"; fi
          all='[
            {"os": "ubuntu-latest", "container": "ubuntu:22.04", "target": "x86_64-unknown-linux-gnu", "bundle_args": "--bundles deb"},
            {"os": "macos-14", "target": "aarch64-apple-darwin", "bundle_args": ""},
            {"os": "macos-15-intel", "target": "x86_64-apple-darwin", "bundle_args": ""},
            {"os": "windows-latest", "target": "x86_64-pc-windows-msvc", "bundle_args": "'"$windows_bundles"'"}
          ]'
          inputs='^(Cargo\.lock$|([^/]+/)?Cargo\.toml$|rust-toolchain\.toml$|desktop/build\.rs$|desktop/windows-app-manifest\.xml$|desktop/icons/|desktop/linux/|desktop/updater-endpoints\.json$|desktop/tauri[^/]*\.json$|desktop/tauri\.conf|desktop/binaries/|scripts/build-geolibre-cli\.sh$|scripts/smoke-bundled-sidecar\.sh$|scripts/check_windows_manifest\.py$|desktop/web/package[^/]*\.json$|\.github/(workflows/build\.yml|actions/|tauri-branch-nsis\.json))'
          filter='.'
          if [ "$PR_RUN" = true ] && [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            changed="$(git diff --no-renames --name-only "$BASE" "$GITHUB_SHA")"
            if ! grep -qE "$inputs" <<<"$changed"; then
              filter='map(select(.os == "ubuntu-latest" or .os == "macos-14"))'
            fi
          fi
          # A packaging change also builds the AppImage, so its container bundling and its Debian 12 start
          # run here before any Release Candidate dispatch (2.1-M173).
          if [ "$filter" = '.' ]; then all="$(jq -c 'map(if .container then .bundle_args = "--bundles deb appimage" else . end)' <<<"$all")"; fi
          echo "matrix=$(jq -c "$filter" <<<"$all")" >> "$GITHUB_OUTPUT"
          # Native tests on Intel macOS (8 min, a scarce macOS runner) add little over Apple silicon on the same OS;
          # PRs run them only when packaging inputs change, like the Intel package.
          platforms='[{"os": "macos-14", "target": "aarch64-apple-darwin"}, {"os": "macos-15-intel", "target": "x86_64-apple-darwin"}, {"os": "windows-latest", "target": "x86_64-pc-windows-msvc"}]'
          pfilter='.'
          if [ "$filter" != '.' ]; then pfilter='map(select(.os != "macos-15-intel"))'; fi
          echo "platforms=$(jq -c "$pfilter" <<<"$platforms")" >> "$GITHUB_OUTPUT"

  docs:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # A PR checks out its merge commit; the first parent is the base, which --drift diffs against.
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Documentation links and lifecycle
        run: python3 scripts/check_docs.py
      # Here, not in lint: a README-only change can move a Playwright image tag too.
      - name: Playwright image tags match the lockfile
        run: python3 scripts/check_playwright_pins.py
      - name: Guides to reread (advice) and deleted plans' decisions
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_docs.py --drift HEAD^1

  lint-rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      CANOPI_SKIP_BUNDLED_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: lint
          cache-on-failure: false
          save-if: ${{ env.SAVE_RUST_CACHE == 'true' }}

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json

      - name: Install frontend deps
        run: npm ci --prefix desktop/web

      # The push lane's cargo-deny and cargo-shear at the adapters' pinned versions (policy/adapters/cargo-deny.mjs,
      # cargo-shear.mjs). `cargo install`, never a prebuilt: cargo-shear reads its version from the install record.
      - name: Cache the pinned cargo-deny and cargo-shear
        id: cargo-policy-tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-shear
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-policy-tools-${{ runner.os }}-deny-0.20.2-shear-1.13.2
      - name: Install the pinned cargo-deny and cargo-shear
        if: steps.cargo-policy-tools.outputs.cache-hit != 'true'
        run: |
          cargo install --locked --version 0.20.2 cargo-deny
          cargo install --locked --version 1.13.2 cargo-shear
      # The adapter falls back to this cached database when the advisory fetch fails twice.
      - name: Cache the advisory database
        uses: actions/cache@v4
        with:
          path: ~/.cargo/advisory-dbs
          key: advisory-db-${{ github.run_id }}
          restore-keys: advisory-db-

      # The Rust gate's push-lane policy families and their self-test (the disallowed-methods expects, keyed by a clippy
      # run that reuses this job's target directory); --lane push observes the commit lane too.
      - name: Push-lane policy families
        run: npm run test:policies:push --prefix desktop/web

  # The Python and frontend checks; the bindings check runs the Rust generator.
  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      CANOPI_SKIP_BUNDLED_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: lint-bindings
          cache-on-failure: false
          save-if: ${{ env.SAVE_RUST_CACHE == 'true' }}

      - name: Check Species Search Unicode facts
        run: python3 scripts/species_search_unicode_facts.py check

      - name: Species Catalog contract check
        run: python3 scripts/species_catalog_contract.py check

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json

      - name: Install frontend deps
        run: npm ci --prefix desktop/web

      - name: Check generated transport bindings
        run: npm run check:types --prefix desktop/web

      - name: TypeScript check
        run: npm run typecheck --prefix desktop/web

      - name: UI gallery TypeScript check
        run: npm run check:ui --prefix desktop/web

      # The browser, release and Desktop real-app specs type-check here, on every code change, not only where their
      # lane runs (the real-app lane runs only for desktop/** changes).
      - name: Browser and release spec TypeScript checks
        run: |
          npm run typecheck --prefix desktop/web -- -p e2e
          npm run typecheck --prefix desktop/web -- -p e2e-release

      - name: Desktop real-app suite TypeScript check
        run: npm run typecheck --prefix desktop/web -- -p e2e/platform

  # Every scripts/test_*.py, found by discovery, so a new test file runs with no list to edit (2.1-M216).
  # Over 60 s, so a job of its own (DR31); on every change, docs-only too, as some tests read the docs tree.
  # The gate's tests (test_agent_hooks, test_commit_gate, test_deletion_guard, test_gate) run node and
  # desktop/web/node_modules (vitest list, depcruise), so the job installs both.
  script-tests:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json
      - name: Install frontend deps
        run: npm ci --prefix desktop/web
      - name: Script tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  test-rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      CANOPI_SKIP_BUNDLED_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test
          cache-on-failure: false
          save-if: ${{ env.SAVE_RUST_CACHE == 'true' }}

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # `cargo cov` (.cargo/config.toml) runs the workspace tests instrumented
      # and fails below the recorded coverage floor.
      - name: Rust tests with coverage ratchet
        run: cargo cov

  test-frontend:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json

      - name: Install frontend deps
        run: npm ci --prefix desktop/web

      - name: Frontend source-policy tests (the coverage run leaves them out)
        run: npm run test:policies --prefix desktop/web

      - name: Frontend coverage ratchet
        run: npm run test:coverage --prefix desktop/web

      - name: Frontend build
        run: npm run build --prefix desktop/web

      # The release's catalog, as the Release Candidate builds with it, so the package step sees the whole site.
      - name: Download and verify the Web catalog
        run: |
          set -euo pipefail
          asset="$(python3 -I scripts/web_release.py catalog-asset-name)"
          download_dir="$RUNNER_TEMP/web-catalog"
          mkdir -p "$download_dir"
          gh release download "$CANOPI_CORE_DB_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$asset" --pattern "$asset.sha256" --dir "$download_dir"
          (cd "$download_dir" && sha256sum --check --strict "$asset.sha256")
          python3 -I scripts/web_release.py unpack-catalog --archive "$download_dir/$asset" \
            --output-dir desktop/web/catalog-input

      - name: Web Edition build and browser-boundary scan
        run: npm run build:web --prefix desktop/web

      # Each edition's chunks against policy/ratchets/bundle-size.json, once both are built (2.1-Q203, 2.1-M240).
      # Rolldown builds are byte-stable, so a chunk over its tolerance is no flake to retry: the step fails and its
      # summary holds the bead to file. A ceiling is raised only with the user's dated Q row (ADR 0029).
      - name: Bundle size budgets
        shell: bash
        run: |
          set -o pipefail
          if npm run test:policies:bundle --prefix desktop/web 2>&1 | tee "$RUNNER_TEMP/bundle-size.log"; then exit 0; fi
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo '### Bundle size budgets failed'
            echo '```'
            grep -E '^([a-z-]+: |FAIL )' "$RUNNER_TEMP/bundle-size.log" || tail -20 "$RUNNER_TEMP/bundle-size.log"
            echo '```'
            echo 'File the bead:'
            echo '```'
            echo "bd create --type=bug --priority=1 --title=\"Bundle size over budget at ${GITHUB_SHA::12}\" --description=\"npm run test:policies:bundle failed in $run_url; the refusals are in its step summary.\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # The Release Candidate's package and verify, so their refusals (Pages limits, raw DuckDB wasm, a mutable
      # name, a Google key, the catalog) fail the PR, not the Release Candidate (2.1-M216).
      - name: Package and verify the Web Edition as a release would
        shell: bash
        run: |
          set -euo pipefail
          python3 -I scripts/web_release.py package --dist desktop/web/dist-web \
            --output-dir "$RUNNER_TEMP/web-archive" --version 0.0.0-ci --commit "$GITHUB_SHA"
          python3 -I scripts/web_release.py verify --version 0.0.0-ci --commit "$GITHUB_SHA" \
            --archive "$RUNNER_TEMP/web-archive/$(python3 -I scripts/web_release.py archive-name \
              --version 0.0.0-ci --commit "$GITHUB_SHA")" \
            --output-dir "$RUNNER_TEMP/web-site"

  # THIRD_PARTY_NOTICES.md is generated (scripts/generate_notices.mjs). Every build already fails on a bundled npm
  # package the file does not name; this job regenerates the whole file, the Desktop binary's crates through the
  # pinned cargo-about included, and fails on any difference (2.1-M239: a version bump changes nothing).
  notices:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json
      - uses: dtolnay/rust-toolchain@1.97.1
      # scripts/generate_notices.mjs's CARGO_ABOUT_VERSION (third-party-notices.test.ts keeps them equal).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3

      - name: Install frontend deps and fetch the locked crates
        run: |
          npm ci --prefix desktop/web
          cargo fetch --locked

      # Builds both editions (each writes the npm packages it bundles), then regenerates and compares.
      - name: THIRD_PARTY_NOTICES.md is what the generator writes
        run: npm run check:notices --prefix desktop/web

  lidar-native:
    # GeoLibre-backed LiDAR lanes (ignored in the default suite); the engine
    # comparison lane skips itself here, as CI installs no GDAL. Fixture e2e
    # lanes stay local: they need IGN tiles.
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    env:
      CANOPI_SKIP_BUNDLED_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: lidar-native
          cache-on-failure: false
          save-if: ${{ env.SAVE_RUST_CACHE == 'true' }}

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - uses: ./.github/actions/build-geolibre-cli

      - name: LiDAR native lanes
        run: |
          CANOPI_GEOLIBRE_BIN="$PWD/desktop/binaries/geolibre-$(rustc -vV | sed -n 's/^host: //p')"
          export CANOPI_GEOLIBRE_BIN
          cargo test -p canopi-desktop --lib --locked services::lidar -- --ignored --test-threads=1 --skip e2e_ --skip latency_probe

  # test-rust runs the Rust suite on Linux only. File saving, atomic replace,
  # directory sync, locking and paths differ on Windows and macOS, so the
  # native tests run there too, beside packaging: Apple silicon and Windows on every Rust-side change, Intel
  # macOS where it is packaged (changes.outputs.platforms).
  platform-tests:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.platforms) }}
    runs-on: ${{ matrix.os }}
    env:
      CANOPI_SKIP_BUNDLED_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: platform-tests-${{ matrix.target }}
          cache-on-failure: false
          save-if: ${{ env.SAVE_RUST_CACHE == 'true' }}

      # lint-rust lints Linux only; Windows-only code (cfg(windows) paths, process and measurement helpers) is linted
      # here, on the Windows leg every Rust PR runs, not only a packaging PR's Windows build.
      - name: Clippy on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests on this platform
        shell: bash
        run: cargo test --workspace --locked --target ${{ matrix.target }}

  # Packaging runs beside lint and the tests rather than after them, so CI
  # artifacts do not wait for (or depend on) the test results; Release
  # Candidate keeps its own preflight gate.
  build:
    needs: changes
    # Fork PRs package nothing.
    if: >-
      needs.changes.outputs.rust == 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.packaging) }}

    runs-on: ${{ matrix.os }}
    # Linux packages build in ubuntu:22.04 (glibc 2.35), as in Release
    # Candidate; an empty image (macOS, Windows) runs on the runner itself.
    container: ${{ matrix.container }}
    env:
      # The bundler's linuxdeploy is an AppImage; a container has no FUSE.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v7
      # First: the container image has no curl for the Rust toolchain, and
      # brings its own Python.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-deps
      - uses: actions/setup-python@v7
        if: runner.os != 'Linux'
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-${{ matrix.target }}${{ matrix.container && format('-{0}', matrix.container) || '' }}
          cache-on-failure: false
          save-if: ${{ env.SAVE_RUST_CACHE == 'true' }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json

      - name: Install frontend deps
        run: npm ci --prefix desktop/web

      - name: Download bundled plant DB
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          asset_name="$(python3 scripts/species_catalog_contract.py value prepared-db-asset-name)"
          download_dir="$(mktemp -d)"
          trap 'rm -rf "$download_dir"' EXIT
          mkdir -p desktop/resources
          gh release download "$CANOPI_CORE_DB_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$asset_name" \
            --dir "$download_dir"
          test -s "$download_dir/$asset_name"
          mv "$download_dir/$asset_name" desktop/resources/canopi-core.db

      - name: Verify bundled plant DB contract
        shell: bash
        run: >-
          python scripts/species_catalog_contract.py verify-db
          --profile prepared
          desktop/resources/canopi-core.db

      # The sidecar must exist before `tauri build`: build.rs bundles it only
      # when desktop/binaries holds it for the target (the runner's host).
      - uses: ./.github/actions/build-geolibre-cli

      # The locked @tauri-apps/cli devDependency, run from the repository root; never an npx fetch (2.1-M216).
      # macOS runners intermittently refuse the disk image (`hdiutil: create failed - Resource busy`, 2026-10-16);
      # a second try reuses the compiled app, so it costs the bundling step only.
      - name: Build Tauri app
        shell: bash
        run: |
          build() { npm run --prefix desktop/web tauri -- build --target ${{ matrix.target }} ${{ matrix.bundle_args }} -- --locked; }
          if [ "$RUNNER_OS" = macOS ]; then build || { echo "::warning::bundling failed once; retrying"; sleep 10; build; }; else build; fi

      - name: Windows app selects Common Controls v6
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m pip install --quiet pefile
          exe=""
          for name in canopi-desktop.exe Canopi.exe; do
            if [ -f "target/${{ matrix.target }}/release/$name" ]; then exe="target/${{ matrix.target }}/release/$name"; break; fi
          done
          test -n "$exe" || { echo "no Canopi executable under target/${{ matrix.target }}/release" >&2; exit 1; }
          python scripts/check_windows_manifest.py "$exe"

      - name: Packaged sidecar runs from the installed layout
        shell: bash
        run: scripts/smoke-bundled-sidecar.sh ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: canopi-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/**/*.deb
            target/${{ matrix.target }}/release/bundle/**/*.AppImage
            target/${{ matrix.target }}/release/bundle/**/*.dmg
            target/${{ matrix.target }}/release/bundle/**/*.msi
            target/${{ matrix.target }}/release/bundle/**/*.exe
          if-no-files-found: error

  # The Linux package starts on Debian 12, as in Release Candidate: the sidecar
  # runs from the unpacked .deb, both binaries meet the glibc floor, and on a
  # packaging change the AppImage gets past the loader.
  linux-floor:
    needs: build
    runs-on: ubuntu-latest
    container: debian:12
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install the desktop base libraries
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y binutils libdrm2 libegl1 libexpat1 libfontconfig1 libfreetype6 \
            libfribidi0 libgbm1 libgl1 libharfbuzz0b libwayland-client0 libx11-6 libx11-xcb1 libxcb1

      - uses: actions/download-artifact@v8
        with:
          name: canopi-x86_64-unknown-linux-gnu
          path: bundle

      - name: Packaged binaries start on Debian 12
        shell: bash
        run: scripts/smoke-bundled-sidecar.sh x86_64-unknown-linux-gnu bundle

  # The one check a branch rule needs: every job above, whichever the path filters ran. A skipped job passes; a failed
  # or cancelled one fails this job. A new job joins `needs`.
  build-and-test:
    name: Build & Test
    needs: [changes, docs, lint-rust, lint, script-tests, test-rust, test-frontend, notices, lidar-native, platform-tests, build, linux-floor]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
