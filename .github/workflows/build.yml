name: Build & Test

on:
  push:
    # Work lands through PRs into main (AGENTS.md), and stable fixes into release/2.0 until 2.1.0
    # (docs/guides/native-and-release.md#stable-fixes); both branches run everything.
    branches: [main, release/2.0]
  pull_request:
    branches: [main, release/2.0]

# A PR update cancels that PR's older run. Every push to main or release/2.0 has a group of its own, so it always
# finishes: a shared group would let GitHub drop a pending run whatever cancel-in-progress says.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Rust caches are saved only from main, whose caches every PR can restore;
  # PR refs restore without adding copies.
  SAVE_RUST_CACHE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
  CANOPI_CORE_DB_RELEASE_TAG: canopi-core-db

jobs:
  # Docs, bead and design-board changes run only the docs checks and the script
  # tests, plus the toolchain scanner test for a guide, README or AGENTS.md. On a
  # PR into main or release/2.0, each area job runs when `policy/gate/cli.mjs areas`
  # selects its area (the Rust row also runs the LiDAR lanes, platform tests and
  # installers); when the Frontend row does not run, the scripts job runs the
  # vitest files the affected lane adds (`areas`' tests); a push and an unknown base run all.
  # The lanes this workflow calls (real app, browsers with the axe ratchet, updater, the release build's dry run) run
  # when their own areas are selected, on a push too, as their own path triggers did; an unknown base runs them all.
  # Every step is a gate call or a ci row of policy/gate/table.ts (policy/gate/ci-parity.test.ts).
  # A same-repo PR from main runs nothing: the push run already checks its head.
  changes:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      github.head_ref != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      PR_RUN: ${{ github.event_name == 'pull_request' }}
    outputs:
      code: ${{ steps.diff.outputs.code }}
      rust: ${{ steps.diff.outputs.rust }}
      frontend: ${{ steps.diff.outputs.frontend }}
      policy: ${{ steps.diff.outputs.policy }}
      tauri: ${{ steps.diff.outputs.tauri }}
      contracts: ${{ steps.diff.outputs.contracts }}
      species: ${{ steps.diff.outputs.species }}
      packaging_inputs: ${{ steps.diff.outputs.packaging }}
      workflows: ${{ steps.diff.outputs.workflows }}
      real_app: ${{ steps.diff.outputs.real_app }}
      web_browsers: ${{ steps.diff.outputs.web_browsers }}
      updater: ${{ steps.diff.outputs.updater }}
      release_build: ${{ steps.diff.outputs.release_build }}
      tests: ${{ steps.diff.outputs.tests }}
      base: ${{ steps.base.outputs.sha }}
      packaging: ${{ steps.packaging.outputs.matrix }}
      platforms: ${{ steps.packaging.outputs.platforms }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The gate's `areas` runs by Node's type stripping and needs no packages.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # A push diffs from the head of the branch's last successful push run, not
      # from `before`: the previous push's run may have failed or still be running
      # beside this one, so a docs-only push would otherwise skip that push's
      # unproven code. None found: run everything.
      - id: base
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            sha="$PR_BASE"
          else
            sha="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --branch "$GITHUB_REF_NAME" \
              --event push --status success --limit 1 --json headSha --jq '.[0].headSha // ""')" || sha=""
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      # Only policy/gate/table.ts's areas select (design check AR2): `gate areas` names whether the change holds code and
      # the areas it selects, and each area job below runs when its own area is selected. A push, and an unknown base,
      # run everything.
      - id: diff
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          tests=""
          flags="code rust frontend policy tauri contracts species packaging workflows real_app web_browsers updater release_build"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            for name in $flags; do declare "$name=true"; done
          else
            sel="$(node policy/gate/cli.mjs areas --base "$BASE")"
            has() { jq -e --arg a "$1" '.selected | index($a) != null' >/dev/null <<<"$sel"; }
            code="$(jq -r '.code' <<<"$sel")"
            rust=$code frontend=$code policy=$code tauri=$code contracts=$code species=$code packaging=$code workflows=$code
            real_app=false web_browsers=false updater=false release_build=false
            if has real-app; then real_app=true; fi
            if has web-browsers; then web_browsers=true; fi
            if has updater; then updater=true; fi
            if has release-build; then release_build=true; fi
            if [ "$PR_RUN" = true ]; then
              rust=false frontend=false policy=false tauri=false contracts=false species=false packaging=false workflows=false
              if has rust; then rust=true; fi
              if has frontend; then frontend=true; fi
              if has policy-tooling; then policy=true; fi
              if has tauri-command; then tauri=true; fi
              if has shared-contracts; then contracts=true; fi
              if has species-catalog; then species=true; fi
              if has packaging; then packaging=true; fi
              if has workflows; then workflows=true; fi
            fi
            # When the frontend job is off, whose coverage run holds them, the vitest files the affected lane adds: the
            # toolchain scanner and each test naming a changed file (a guide included), the always-run families for a
            # code change.
            if [ "$frontend" = false ]; then tests="$(jq -r '.tests | join(" ")' <<<"$sel")"; fi
          fi
          for name in $flags; do echo "$name=${!name}"; done >> "$GITHUB_OUTPUT"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
      # PRs package Linux and Apple silicon, and Windows too when they change a packaging input (the gate's packaging
      # area); pushes to main and Release Candidate package all four. The Intel macOS build was Build & Test's long pole
      # on PRs (26.6 min measured 2026-11-04; the frontend job 18), so PRs never package Intel macOS: its unsigned dmg
      # (2.1-Q125, Q135) is built on every push to main and by the release dry run, and an Intel-only break surfaces on
      # main. PRs build one installer per OS: Linux .deb (as everywhere) and Windows NSIS only, the one the sidecar smoke
      # unpacks; no MSI.
      - id: packaging
        env:
          EVERY_PLATFORM: ${{ steps.diff.outputs.packaging }}
        run: |
          set -euo pipefail
          windows_bundles=""
          # LZMA took 13.5 of the Windows job's 24 min on 2026-10-14 for a 291 MiB installer; a PR
          # checks that the installer builds and its sidecar runs, so zlib is enough. Release Candidate keeps LZMA.
          if [ "$PR_RUN" = true ]; then windows_bundles="--bundles nsis --config .github/tauri-branch-nsis.json"; fi
          all='[
            {"os": "ubuntu-latest", "container": "ubuntu:22.04", "target": "x86_64-unknown-linux-gnu", "bundle_args": "--bundles deb"},
            {"os": "macos-15", "target": "aarch64-apple-darwin", "bundle_args": ""},
            {"os": "macos-15-intel", "target": "x86_64-apple-darwin", "bundle_args": ""},
            {"os": "windows-latest", "target": "x86_64-pc-windows-msvc", "bundle_args": "'"$windows_bundles"'"}
          ]'
          every=true
          if [ "$PR_RUN" = true ] && [ "$EVERY_PLATFORM" != true ]; then every=false; fi
          # A packaging change also builds the AppImage, so its container bundling and its Debian 12 start
          # run here before any Release Candidate dispatch (2.1-M173).
          if [ "$every" = true ]; then all="$(jq -c 'map(if .container then .bundle_args = "--bundles deb appimage" else . end)' <<<"$all")"; fi
          filter='.'
          if [ "$every" = false ]; then filter='map(select(.os == "ubuntu-latest" or .os == "macos-15"))'
          elif [ "$PR_RUN" = true ]; then filter='map(select(.os != "macos-15-intel"))'; fi
          echo "matrix=$(jq -c "$filter" <<<"$all")" >> "$GITHUB_OUTPUT"
          # Native tests on Intel macOS (8 min, a scarce macOS runner) add little over Apple silicon on the same OS;
          # they run where Intel is packaged: on pushes, never on PRs.
          platforms='[{"os": "macos-15", "target": "aarch64-apple-darwin"}, {"os": "macos-15-intel", "target": "x86_64-apple-darwin"}, {"os": "windows-latest", "target": "x86_64-pc-windows-msvc"}]'
          pfilter='.'
          if [ "$PR_RUN" = true ]; then pfilter='map(select(.os != "macos-15-intel"))'; fi
          echo "platforms=$(jq -c "$pfilter" <<<"$platforms")" >> "$GITHUB_OUTPUT"

  # The Docs row (policy/gate/table.ts's docs area, 2.1-M198), on every change: the checker, its --drift against
  # origin/main (the full history holds it; on a PR the merge commit's base), the validator's tests and the Playwright
  # image tags (a README-only change can move one).
  docs:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      # The checker reads the rule registry through `node policy/check.mjs --list-rules`, whose glob engine is a
      # desktop/web package.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json
      - name: Install frontend deps
        run: npm ci --prefix desktop/web --no-audit --no-fund
      - name: The Docs row
        run: node policy/gate/cli.mjs full --area docs

  # The Rust row (policy/gate/table.ts's rust area, 2.1-M198): a Cargo.lock the manifests would not change, fmt, clippy,
  # the workspace tests once, through `cargo cov` above its floor, and the push-lane policy check, the command a local
  # `node policy/gate/cli.mjs full --area rust` runs.
  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CANOPI_SKIP_BUNDLED_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust
          cache-on-failure: false
          save-if: ${{ env.SAVE_RUST_CACHE == 'true' }}

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json

      - name: Install frontend deps
        run: npm ci --prefix desktop/web

      - uses: ./.github/actions/cargo-policy-tools

      - name: The Rust row
        run: node policy/gate/cli.mjs full --area rust

  # The A `#[tauri::command]` row (policy/gate/table.ts's tauri-command area): native_command_policy, when ipc/ or a
  # desktop .rs changed and the Rust row, whose workspace tests hold it, does not run.
  tauri-command:
    needs: changes
    if: needs.changes.outputs.tauri == 'true' && needs.changes.outputs.rust != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CANOPI_SKIP_BUNDLED_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: tauri-command
          cache-on-failure: false
          save-if: ${{ env.SAVE_RUST_CACHE == 'true' }}
      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: The A `#[tauri::command]` row
        run: node policy/gate/cli.mjs full --area tauri-command

  # The Policy tooling row (policy/gate/table.ts's policy-tooling area, design check AR8): each lane's planted cases and
  # the push-lane check, where policy/ or a tool or config an adapter runs changed, the
  # command a local `node policy/gate/cli.mjs full --area policy-tooling` runs.
  policy-tooling:
    needs: changes
    if: needs.changes.outputs.policy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CANOPI_SKIP_BUNDLED_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: policy-tooling
          cache-on-failure: false
          save-if: ${{ env.SAVE_RUST_CACHE == 'true' }}
      # The push lane's clippy families build the workspace's GTK/WebKit crates.
      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json
      - name: Install frontend deps
        run: npm ci --prefix desktop/web --no-audit --no-fund
      - uses: ./.github/actions/cargo-policy-tools
      - name: The Policy tooling row
        run: node policy/gate/cli.mjs full --area policy-tooling

  # The Shared contracts row (policy/gate/table.ts's shared-contracts area), when a contract, a generator input or a
  # committed binding changed: check:types fails on a committed binding that differs from what the generator writes, and
  # the Species Search Unicode facts are checked against the pinned Python.
  shared-contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CANOPI_SKIP_BUNDLED_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: shared-contracts
          cache-on-failure: false
          save-if: ${{ env.SAVE_RUST_CACHE == 'true' }}
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      # The gate refuses a desktop/web check without desktop/web/node_modules.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json
      - name: Install frontend deps
        run: npm ci --prefix desktop/web --no-audit --no-fund

      - name: The Shared contracts row
        run: node policy/gate/cli.mjs full --area shared-contracts

  # The Species catalog queries row (policy/gate/table.ts's species-catalog area), when its area is selected.
  species-catalog:
    needs: changes
    if: needs.changes.outputs.species == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: The Species catalog queries row
        run: node policy/gate/cli.mjs full --area species-catalog

  # The CI workflows row (policy/gate/table.ts's workflows area): actionlint over the workflows with
  # .github/actionlint.yaml, when a workflow, its config or a composite action changed, so a workflow GitHub would refuse
  # fails here, not only in a scratch run (canopi-f47t.52.228.15.1). The version and digest are policy/gate/table.ts's pin.
  workflows:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/actionlint.tar.gz" "$url"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "CANOPI_ACTIONLINT=$RUNNER_TEMP/actionlint/actionlint" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: The CI workflows row
        run: node policy/gate/cli.mjs full --area workflows

  # The Script tests row (policy/gate/table.ts's scripts area, 2.1-M216): every scripts/test*.py, found by discovery.
  # Over 60 s, so a job of its own (DR31); on every change, docs-only too, as some tests read the docs tree.
  # Some of these tests run node (the advisories adapter, policy/check.mjs, the gate CLI), so the job installs node and
  # desktop/web/node_modules, and then runs the affected lane's vitest files (the hooks' tests, policy/gate, among them)
  # when the frontend job, whose coverage run holds them, does not run (the full history holds the base the lane diffs
  # from).
  scripts:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json
      - name: Install frontend deps
        run: npm ci --prefix desktop/web
      - name: The Script tests row
        run: node policy/gate/cli.mjs full --area scripts
      - name: The affected lane's vitest files
        if: needs.changes.outputs.tests != ''
        env:
          BASE: ${{ needs.changes.outputs.base }}
        run: node policy/gate/cli.mjs affected --base "$BASE" --only vitest-lane

  # The Frontend row (policy/gate/table.ts's frontend area, 2.1-M198): typecheck, coverage, the commit policy lane, both
  # builds, the bundle budgets after them (2.1-Q203, 2.1-M240) and the notices regenerated from both bundles and the
  # pinned cargo-about (2.1-M239), the command a local `node policy/gate/cli.mjs full --area frontend` runs; its
  # coverage run holds the gate's own Vitest project (policy/gate). The release's catalog is downloaded first, so the
  # Web build and the package step after the row see the whole site.
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json
      - uses: dtolnay/rust-toolchain@1.97.1
      # scripts/generate_notices.mjs's CARGO_ABOUT_VERSION (third-party-notices.test.ts keeps them equal).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3

      - name: Install frontend deps and fetch the locked crates
        run: |
          npm ci --prefix desktop/web
          cargo fetch --locked

      # The push-lane policy checks hold the clippy families, which build the workspace's GTK/WebKit crates.
      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Download and verify the Web catalog
        run: |
          set -euo pipefail
          asset="$(python3 -I scripts/web_release.py catalog-asset-name)"
          download_dir="$RUNNER_TEMP/web-catalog"
          mkdir -p "$download_dir"
          gh release download "$CANOPI_CORE_DB_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$asset" --pattern "$asset.sha256" --dir "$download_dir"
          (cd "$download_dir" && sha256sum --check --strict "$asset.sha256")
          python3 -I scripts/web_release.py unpack-catalog --archive "$download_dir/$asset" \
            --output-dir desktop/web/catalog-input

      - name: The Frontend row
        shell: bash
        run: |
          set -o pipefail
          node policy/gate/cli.mjs full --area frontend 2>&1 | tee "$RUNNER_TEMP/frontend-row.log"

      # The Release Candidate's package and verify, so their refusals (Pages limits, raw DuckDB wasm, a mutable
      # name, a Google key, the catalog) fail the PR, not the Release Candidate (2.1-M216).
      - name: Package and verify the Web Edition as a release would
        shell: bash
        run: |
          set -euo pipefail
          python3 -I scripts/web_release.py package --dist desktop/web/dist-web \
            --output-dir "$RUNNER_TEMP/web-archive" --version 0.0.0-ci --commit "$GITHUB_SHA"
          python3 -I scripts/web_release.py verify --version 0.0.0-ci --commit "$GITHUB_SHA" \
            --archive "$RUNNER_TEMP/web-archive/$(python3 -I scripts/web_release.py archive-name \
              --version 0.0.0-ci --commit "$GITHUB_SHA")" \
            --output-dir "$RUNNER_TEMP/web-site"

      # Rolldown builds are byte-stable, so a chunk over its tolerance is no flake to retry: the summary holds the
      # bundle check's refusals and the bead to file. A ceiling is raised only with the user's dated Q row (ADR 0029).
      - name: Bundle size budgets summary
        if: failure()
        shell: bash
        run: |
          log="$RUNNER_TEMP/frontend-row.log"
          # The whole line: test:policies:bundle:self-test's FAIL line is no bundle over budget.
          grep -qxF 'gate: FAIL cd desktop/web && npm run test:policies:bundle' "$log" 2>/dev/null || exit 0
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo '### Bundle size budgets failed'
            echo '```'
            sed -n '/^gate: cd desktop\/web && npm run test:policies:bundle$/,/^gate: /p' "$log" | grep -E '^([a-z-]+: |FAIL )' | grep -v '^gate: ' || true
            echo '```'
            echo 'File the bead:'
            echo '```'
            echo "bd create --type=bug --priority=1 --title=\"Bundle size over budget at ${GITHUB_SHA::12}\" --description=\"npm run test:policies:bundle failed in $run_url; the refusals are in its step summary.\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  lidar-native:
    # GeoLibre-backed LiDAR lanes (ignored in the default suite); the engine
    # comparison lane skips itself here, as CI installs no GDAL. Fixture e2e
    # lanes stay local: they need IGN tiles.
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CANOPI_SKIP_BUNDLED_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: lidar-native
          cache-on-failure: false
          save-if: ${{ env.SAVE_RUST_CACHE == 'true' }}

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - uses: ./.github/actions/build-geolibre-cli

      - name: LiDAR native lanes
        run: |
          CANOPI_GEOLIBRE_BIN="$PWD/desktop/binaries/geolibre-$(rustc -vV | sed -n 's/^host: //p')"
          export CANOPI_GEOLIBRE_BIN
          cargo test -p canopi-desktop --lib --locked services::lidar -- --ignored --test-threads=1 --skip e2e_ --skip latency_probe

  # test-rust runs the Rust suite on Linux only. File saving, atomic replace,
  # directory sync, locking and paths differ on Windows and macOS, so the
  # native tests run there too, beside packaging: Apple silicon and Windows on every Rust-side change, Intel
  # macOS where it is packaged, on pushes only (changes.outputs.platforms).
  platform-tests:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.platforms) }}
    runs-on: ${{ matrix.os }}
    env:
      CANOPI_SKIP_BUNDLED_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: platform-tests-${{ matrix.target }}
          cache-on-failure: false
          save-if: ${{ env.SAVE_RUST_CACHE == 'true' }}

      # lint-rust lints Linux only; Windows-only code (cfg(windows) paths, process and measurement helpers) is linted
      # here, on the Windows leg every Rust PR runs, not only a packaging PR's Windows build.
      - name: Clippy on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests on this platform
        shell: bash
        run: cargo test --workspace --locked --target ${{ matrix.target }}

  # Packaging runs beside lint and the tests rather than after them, so CI
  # artifacts do not wait for (or depend on) the test results; Release
  # Candidate keeps its own preflight gate.
  build:
    needs: changes
    # Fork PRs package nothing.
    if: >-
      (needs.changes.outputs.rust == 'true' || needs.changes.outputs.packaging_inputs == 'true') &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.packaging) }}

    runs-on: ${{ matrix.os }}
    # Linux packages build in ubuntu:22.04 (glibc 2.35), as in Release
    # Candidate; an empty image (macOS, Windows) runs on the runner itself.
    container: ${{ matrix.container }}
    env:
      # The bundler's linuxdeploy is an AppImage; a container has no FUSE.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v7
      # First: the container image has no curl for the Rust toolchain, and
      # brings its own Python.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-deps
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-${{ matrix.target }}${{ matrix.container && format('-{0}', matrix.container) || '' }}
          cache-on-failure: false
          save-if: ${{ env.SAVE_RUST_CACHE == 'true' }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json

      - name: Install frontend deps
        run: npm ci --prefix desktop/web

      # The sidecar must exist before `tauri build`: build.rs bundles it only
      # when desktop/binaries holds it for the target (the runner's host).
      - uses: ./.github/actions/build-geolibre-cli

      # The Release Candidate's packaging, with no updater, channel or signing key (design check AR4).
      - uses: ./.github/actions/package-desktop
        with:
          target: ${{ matrix.target }}
          bundle-args: ${{ matrix.bundle_args }}

  # The Linux package starts on Debian 12, as in Release Candidate: the sidecar
  # runs from the unpacked .deb, both binaries meet the glibc floor, and on a
  # packaging change the AppImage gets past the loader.
  linux-floor:
    needs: build
    runs-on: ubuntu-latest
    container: debian:12
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install the desktop base libraries
        run: .github/actions/package-desktop/floor-libs.sh

      - uses: actions/download-artifact@v8
        with:
          name: canopi-x86_64-unknown-linux-gnu
          path: bundle

      - name: Packaged binaries start on Debian 12
        shell: bash
        run: scripts/smoke-bundled-sidecar.sh x86_64-unknown-linux-gnu bundle

  # The lanes Build & Test binds by calling them (design check AR3, connections finding 3), the Release Candidate's
  # build among them as the release build's dry run (canopi-f47t.52.228.61): each runs when its own area is selected, needs only the changes job and is needed only by Build & Test, so a rerun of a failed lane reruns it
  # and the aggregate alone; each called workflow groups under its own literal name, so a superseded PR run cancels its
  # lanes with it and no lane waits on another's group (policy/gate/ci-parity.test.ts).
  real-app:
    needs: changes
    if: needs.changes.outputs.real_app == 'true'
    uses: ./.github/workflows/desktop-real-app.yml

  web-browsers:
    needs: changes
    if: needs.changes.outputs.web_browsers == 'true'
    uses: ./.github/workflows/web-edition-browsers.yml

  updater:
    needs: changes
    if: needs.changes.outputs.updater == 'true'
    uses: ./.github/workflows/updater-e2e.yml

  release-build:
    needs: changes
    if: needs.changes.outputs.release_build == 'true'
    uses: ./.github/workflows/release-candidate.yml

  # The one check a branch rule needs: every job above, whichever the areas ran. A skipped job passes; a failed
  # or cancelled one fails this job. A new job joins `needs`.
  build-and-test:
    name: Build & Test
    needs: [changes, docs, rust, tauri-command, policy-tooling, shared-contracts, species-catalog, workflows, scripts, frontend, lidar-native, platform-tests, build, linux-floor, real-app, web-browsers, updater, release-build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every job passed or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
