name: Build the pinned GeoLibre CLI
description: >-
  Restore the pinned GeoLibre CLI sidecar from cache or the prebuilt GitHub Release
  asset for scripts/build-geolibre-cli.sh's REVISION (Stage 1 E2), falling back to a
  source build when no prebuilt asset exists yet. Writes
  desktop/binaries/geolibre-<host triple>, the sidecar name Tauri bundles beside the
  application executable.

runs:
  using: composite
  steps:
    # The build base (the job container's or runner's distribution) is in the
    # key: a sidecar built on a newer glibc must never be restored into the
    # ubuntu:22.04 package build (canopi-eon8.14.6).
    - name: Read the build base and pinned revision
      id: meta
      shell: bash
      run: |
        set -euo pipefail
        base="${{ runner.os }}"
        if [ -r /etc/os-release ]; then base="$(. /etc/os-release && echo "$ID-$VERSION_ID")"; fi
        rev="$(sed -n 's/^REVISION=//p' scripts/build-geolibre-cli.sh | head -n1)"
        triple="$(rustc -vV | sed -n 's/^host: //p')"
        ext=""
        case "$triple" in *windows*) ext=".exe" ;; esac
        echo "image=$base" >> "$GITHUB_OUTPUT"
        echo "revision=$rev" >> "$GITHUB_OUTPUT"
        echo "triple=$triple" >> "$GITHUB_OUTPUT"
        echo "asset=geolibre-$triple$ext" >> "$GITHUB_OUTPUT"

    - name: Cache the pinned GeoLibre CLI
      id: geolibre-cache
      uses: actions/cache@v4
      with:
        path: desktop/binaries
        key: geolibre-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.meta.outputs.image }}-${{ hashFiles('scripts/build-geolibre-cli.sh') }}

    - name: Download prebuilt GeoLibre CLI sidecar
      id: prebuilt
      if: steps.geolibre-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        TAG: geolibre-cli-${{ steps.meta.outputs.revision }}
        ASSET: ${{ steps.meta.outputs.asset }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        mkdir -p desktop/binaries
        base_url="https://github.com/${REPO}/releases/download/${TAG}"
        tmp="$(mktemp -d)"
        if curl -fsSL --retry 2 --connect-timeout 15 -o "$tmp/$ASSET" "$base_url/$ASSET" \
          && curl -fsSL --retry 2 --connect-timeout 15 -o "$tmp/$ASSET.sha256" "$base_url/$ASSET.sha256"; then
          expected="$(awk '{print $1}' "$tmp/$ASSET.sha256")"
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "$tmp/$ASSET" | awk '{print $1}')"
          else
            actual="$(shasum -a 256 "$tmp/$ASSET" | awk '{print $1}')"
          fi
          if [ "$expected" = "$actual" ]; then
            mv "$tmp/$ASSET" "desktop/binaries/$ASSET"
            chmod +x "desktop/binaries/$ASSET"
            echo "downloaded=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::warning::Prebuilt GeoLibre CLI checksum mismatch ($expected != $actual); falling back to source build"
        else
          echo "No prebuilt GeoLibre CLI asset for $TAG ($ASSET); falling back to source build"
        fi
        echo "downloaded=false" >> "$GITHUB_OUTPUT"

    - name: Build the pinned GeoLibre CLI
      if: steps.geolibre-cache.outputs.cache-hit != 'true' && steps.prebuilt.outputs.downloaded != 'true'
      shell: bash
      env:
        GEOLIBRE_RUST_SRC: ${{ runner.temp }}/geolibre-rust
        GEOLIBRE_TARGET_DIR: ${{ runner.temp }}/geolibre-target
      run: scripts/build-geolibre-cli.sh

    - name: Sidecar present for this host
      shell: bash
      run: |
        set -euo pipefail
        sidecar="desktop/binaries/${{ steps.meta.outputs.asset }}"
        test -x "$sidecar"
        "$sidecar" version
