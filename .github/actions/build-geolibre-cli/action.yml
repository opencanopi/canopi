name: Build the pinned GeoLibre CLI
description: >-
  Build (or restore from cache) the GeoLibre CLI at the revision pinned in
  scripts/build-geolibre-cli.sh into desktop/binaries/geolibre-<host triple>,
  the sidecar name Tauri bundles beside the application executable.

runs:
  using: composite
  steps:
    # The build base (the job container's or runner's distribution) is in the
    # key: a sidecar built on a newer glibc must never be restored into the
    # ubuntu:22.04 package build (canopi-eon8.14.6).
    - name: Read the build base
      id: base
      shell: bash
      run: |
        base="${{ runner.os }}"
        if [ -r /etc/os-release ]; then base="$(. /etc/os-release && echo "$ID-$VERSION_ID")"; fi
        echo "image=$base" >> "$GITHUB_OUTPUT"

    - name: Cache the pinned GeoLibre CLI
      id: geolibre-cache
      uses: actions/cache@v4
      with:
        path: desktop/binaries
        key: geolibre-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.base.outputs.image }}-${{ hashFiles('scripts/build-geolibre-cli.sh') }}

    - name: Build the pinned GeoLibre CLI
      if: steps.geolibre-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GEOLIBRE_RUST_SRC: ${{ runner.temp }}/geolibre-rust
        GEOLIBRE_TARGET_DIR: ${{ runner.temp }}/geolibre-target
      run: scripts/build-geolibre-cli.sh

    - name: Sidecar present for this host
      shell: bash
      run: |
        set -euo pipefail
        triple="$(rustc -vV | sed -n 's/^host: //p')"
        ext=""
        case "$triple" in *windows*) ext=".exe" ;; esac
        sidecar="desktop/binaries/geolibre-$triple$ext"
        test -x "$sidecar"
        "$sidecar" version
