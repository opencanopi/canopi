name: Install Linux dependencies
description: >-
  Install the shared Ubuntu packages needed by CI and release packaging. On a
  hosted runner it uses sudo; inside a job container (root, the ubuntu:22.04
  build base of the Linux packages) it runs apt directly and also installs the
  tools the runner image would provide.

runs:
  using: composite
  steps:
    - name: Install apt packages
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -euo pipefail
        sudo=sudo
        container_tools=()
        if [ "$(id -u)" = 0 ]; then
          sudo=""
          # A bare image lacks what hosted runners carry: the GitHub CLI (DB
          # download), git (GeoLibre CLI source), compilers and OpenSSL headers,
          # Python (`python` in workflow steps), and file and xdg-utils for the
          # AppImage bundler.
          container_tools=(
            build-essential ca-certificates curl file gh git libssl-dev
            python3 python-is-python3 xdg-utils
          )
        fi
        $sudo apt-get update
        $sudo apt-get install -y \
          pkg-config \
          libcairo2-dev \
          libglib2.0-dev \
          libgtk-3-dev \
          libwebkit2gtk-4.1-dev \
          librsvg2-dev \
          patchelf \
          "${container_tools[@]}"
