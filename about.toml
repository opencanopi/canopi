# cargo-about configuration for THIRD_PARTY_NOTICES.md (scripts/generate_notices.mjs, whose CARGO_ABOUT_VERSION
# pins the tool).
# The crates listed are those the Desktop binary links on the release targets: normal dependencies only, so build
# scripts, proc-macro hosts' build-only crates and dev-dependencies are left out. Run offline (`--frozen`).
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Every licence a linked crate may carry; a crate under any other licence fails the generator until it is reviewed
# and added here.
accepted = [
    "0BSD",
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "IJG",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
