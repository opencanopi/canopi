[package]
name = "canopi-support"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Narrow support crate for Phase 2b (2.1-M542): durable files behind `DurableFs`,
# `TargetLocks`, `FaultFs` crash model, content hashing, and `fs4` disk free-space.
# No `tokio` until Phase 3 N1 (2.1-M542).
[dependencies]
fs4 = { version = "1.1", default-features = false, features = ["sync"] }
sha2 = "0.10"
tempfile = "3"
tracing = "0.1"

[dev-dependencies]
# Fixed-seed property tests for interleaved publish and ALICE/lazyfs crash recovery (ADR 0028).
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }

[lints]
workspace = true
