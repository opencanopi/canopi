[package]
name = "canopi-redact"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# A leaf with no required dependency beyond serde (ADR 0023, 2.1-M424): specta is optional, for the TS brand
# bindings-gen emits through canopi-types.
[features]
specta = ["dep:specta"]

[dependencies]
serde = { version = "1", features = ["derive"] }
specta = { version = "=2.0.0-rc.23", features = ["derive"], optional = true }

[dev-dependencies]
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
serde_json = "1"

[lints]
workspace = true
