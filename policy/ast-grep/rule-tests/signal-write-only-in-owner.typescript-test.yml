id: signal-write-only-in-owner.typescript
valid:
  # P44: a read is no write.
  - |
    import { locale } from './settings/state'
    if (locale.value === 'fr') void 0
  # A module writes the signals it declares, in a setter or not.
  - |
    import { signal } from '@preact/signals'
    const localCount = signal(0)
    export const theme = signal('light')
    localCount.value = 1
    export function setTheme(next: string) { theme.value = next }
  # The owner's setter is the owner's write.
  - |
    import { setStoryPresentationOverrides } from './overrides'
    setStoryPresentationOverrides(null)
  # A name imported under an alias is the alias: a local `locale` is no imported binding.
  - |
    import { locale as activeLocale } from './settings/state'
    declare const locale: { value: string }
    locale.value = 'fr'
  # An imported object's own field is no signal write.
  - |
    import { config } from './config'
    config.value.count = 1
  # A local signal from an imported hook or factory is the module's own signal.
  - |
    import { signal, useSignal } from '@preact/signals'
    const open = useSignal(false)
    const local = signal(0)
    open.value = true
    local.value = 1
  # The owner writes through its own accessor and a parameter of its own type.
  - |
    import { signal, type Signal } from '@preact/signals'
    interface View { readonly filter: Signal<string> }
    function viewFor(): View { return { filter: signal('') } }
    viewFor().filter.value = ''
    const view = viewFor()
    view.filter.value = 'a'
    function clear(target: View) { target.filter.value = '' }
  # A DOM element's value is no signal: an unannotated parameter.
  - |
    import { h } from 'preact'
    const onInput = (event: { currentTarget: { value: string } }) => { event.currentTarget.value = '' }
  # A DOM element's value written through a Preact ref is no signal: a local from useRef or createRef, a parameter
  # typed RefObject, MutableRef or Ref, even beside an imported signal accessor.
  - |
    import { createRef, type Ref } from 'preact'
    import { useRef, type MutableRef } from 'preact/hooks'
    import type { RefObject } from 'preact'
    import { usePlanningViewState } from '../../app/planning-view/state'
    const view = usePlanningViewState()
    const input = useRef<HTMLInputElement>(null)
    const area = createRef<HTMLTextAreaElement>()
    const clear = () => { if (input.current) input.current.value = '' }
    if (area.current) area.current.value = ''
    export function reset(ref: RefObject<HTMLTextAreaElement>) { if (ref.current) ref.current.value = '' }
    export function resetMutable(ref: MutableRef<HTMLInputElement | null>) { if (ref.current) ref.current.value = '' }
    export function resetAny(ref: Ref<HTMLSelectElement>) { if (ref && 'current' in ref && ref.current) ref.current.value = '' }
  # An object built here holds this module's signals.
  - |
    import { signal } from '@preact/signals'
    const signals = { count: signal(0) }
    signals.count.value = 1
invalid:
  # P44's cases: src/web/BrowserAppShell.tsx and src/app/planted.ts.
  - |
    import { locale } from '../app/settings/state'
    locale.value = 'fr'
  - |
    import { theme } from '../app/settings/state'
    theme.value = 'dark'
  - |
    import { snapToGridEnabled } from './canvas-settings/signals'
    snapToGridEnabled.value = true
  - |
    import { sidePanelWidth } from './shell/state'
    sidePanelWidth.value += 10
  - |
    import * as settings from './settings/state'
    settings.googleMapsApiKey.value = null
  - |
    import { mapLayers } from './map-layers/state'
    declare const next: never[]
    mapLayers.value = next
  - |
    import { scrollWheel } from './settings/state'
    scrollWheel.value++
  # P44 exempted app/settings/projection.ts; it writes signals settings/state.ts declares, so it counts here.
  - |
    import { locale } from './state'
    locale.value = 'fr'
  # An aliased and a default import, a decrement and a logical assignment.
  - |
    import { theme as activeTheme } from './settings/state'
    activeTheme.value = 'dark'
  - |
    import counter from './counter'
    counter.value--
  - |
    import { pending } from './queue'
    pending.value ??= 'idle'
  # A signal held by an object the owner's accessor returns: a local bound from an imported call.
  - |
    import { usePlanningViewState } from '../../app/planning-view/state'
    const view = usePlanningViewState()
    view.plantsSearch.value = 'oak'
  # The accessor's call as the root.
  - |
    import { readPlanningViewState } from '../planning-view/state'
    readPlanningViewState().plantsSearch.value = ''
  # A parameter typed by an imported type: the owner's object passed in.
  - |
    import type { SiteDataView } from '../../../app/lidar/site-data-view'
    export function clear(view: SiteDataView): void { view.filter.value = '' }
  - |
    import { type SiteDataView } from '../../../app/lidar/site-data-view'
    export const List = ({ view }: { readonly view: SiteDataView }) => { view.openItem.value = null }
  # A ref beside an imported accessor exempts only the ref: the accessor's signal still counts.
  - |
    import { useRef } from 'preact/hooks'
    import { usePlanningViewState } from '../../app/planning-view/state'
    const input = useRef<HTMLInputElement>(null)
    const view = usePlanningViewState()
    view.plantsSearch.value = 'oak'
