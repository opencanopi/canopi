id: credential-literal-only-in-redactors.typescript
valid:
  - |
    export const words = /\s+/g
  - |
    export const field = 'api_key'
  - |
    export const chord = /^Key[A-Z]$/
invalid:
  - |
    export const KEY = /(^|[?&])(key|session)=[^&]+/gi
  - |
    export const HOME = /\/home\/[^/]+/g
  - |
    export const TOKEN = /[?&]access_token=[^&]+/
  - |
    export const FILE = new RegExp(String.raw`\bfile:\/\/\/`, 'g')
