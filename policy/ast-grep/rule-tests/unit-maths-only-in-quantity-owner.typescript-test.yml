id: unit-maths-only-in-quantity-owner.typescript
valid:
  - |
    export const meters = 10
  - |
    export const ratio = 72 / (CONVERSION_CONSTANTS.mPerInch * 1000)
invalid:
  - |
    export const feet = meters / 0.3048
  - |
    export const mmPerInch = 25.4
  - |
    export const miles = meters / 1609.344
  - |
    export const acres = area / 4046.8564224
  - |
    export const gallons = liters / 3.785411784
  - |
    export const f = c * 9 / 5 + 32
  - |
    export const c = (f - 32) * 5 / 9
