id: ids-only-in-minters.typescript
valid:
  - |
    import { createUuid } from './ids'
    export const id = createUuid()
  - |
    export const n = (x: number) => x.toString(36)
invalid:
  - |
    export const id = crypto.randomUUID()
  - |
    export const id = globalThis.crypto?.randomUUID?.()
  - |
    export const id = `draft-${Math.random().toString(36).slice(2)}`
