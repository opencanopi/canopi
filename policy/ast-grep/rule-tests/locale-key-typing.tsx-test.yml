id: locale-key-typing.tsx
valid:
  - |
    export const Label = ({ action }: { action: 'sow' | 'prune' }) => <span>{t(ACTION_LABEL_KEYS[action])}</span>
invalid:
  - |
    export const Label = ({ name }: { name: string }) => <span>{t(name as LocaleKey)}</span>
  - |
    export const Value = ({ value }: { value: string }) => <span>{isLocaleKey(value) ? t(value) : value}</span>
