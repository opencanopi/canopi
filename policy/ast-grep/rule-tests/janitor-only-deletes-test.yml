id: janitor-only-deletes
valid:
  - |
    fn f(p: &Path) { let _ = p.exists(); }
  - |
    #[cfg(test)]
    mod tests {
        fn t() { std::fs::remove_file("a").unwrap(); }
    }

invalid:
  - |
    fn f(p: &Path) { std::fs::remove_file(p).unwrap(); }
  - |
    fn f(p: &Path) { fs::remove_dir_all(p).ok(); }
  - |
    async fn f(p: &Path) { tokio::fs::remove_dir(p).await.ok(); }
