# desktop-shortcuts-import-only-keymap-rows (FAP conversion, F1a): Desktop shortcuts match the neutral shell catalog
id: desktop-shortcuts-import-only-keymap-rows.tsx
language: tsx
severity: error
message: "Desktop shortcuts match the neutral shell catalog; owner desktop/web/src/app/keyboard/keymap.ts; example desktop/web/src/app/keyboard/keymap.ts"
files:
  - "{desktop/web,policy/fixtures/rules/*}/src/**/__none__.tsx"
ignores:
  - "{desktop/web,policy/fixtures/rules/*}/src/__tests__/**"
  - "{desktop/web,policy/fixtures/rules/*}/src/**/*.test.ts"
  - "{desktop/web,policy/fixtures/rules/*}/src/**/*.test.tsx"
utils:
  target-module:
    kind: string_fragment
    regex: '(^|/)app/keyboard/keymap(\.tsx?)?$'
rule:
  any:
    - kind: import_specifier
      inside: { stopBy: end, kind: import_statement, has: { field: source, has: { matches: target-module } } }
      not: { has: { field: name, regex: ^(shellKeymapRows|CANVAS_KEYMAP_ROWS|CommandSink|KeymapRow)$ } }
    - kind: namespace_import
      inside: { stopBy: end, kind: import_statement, has: { field: source, has: { matches: target-module } } }
    - kind: program
      not: { has: { stopBy: end, kind: import_specifier, has: { field: name, regex: ^shellKeymapRows$ }, inside: { stopBy: end, kind: import_statement, has: { field: source, has: { matches: target-module } } } } }
    - kind: program
      not: { has: { stopBy: end, kind: import_specifier, has: { field: name, regex: ^CANVAS_KEYMAP_ROWS$ }, inside: { stopBy: end, kind: import_statement, has: { field: source, has: { matches: target-module } } } } }
