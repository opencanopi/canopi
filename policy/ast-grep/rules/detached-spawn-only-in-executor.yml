# detached-spawn-only-in-executor (§18 R2): a detached task (tauri::async_runtime::spawn, tokio::spawn, tokio::task::spawn) starts only in the executor, whose bounded drain joins it; an interim site ratchet that N1 replaces with clippy disallowed-methods in the change that builds the owner
# message and ignores: generated from policy/primitives.json.
id: detached-spawn-only-in-executor
language: rs
severity: error
message: "detached-spawn-only-in-executor (§18 R2): a detached task (tauri::async_runtime::spawn, tokio::spawn, tokio::task::spawn) starts only in the executor, whose bounded drain joins it; an interim site ratchet that N1 replaces with clippy disallowed-methods in the change that builds the owner. ADR 0025; owner desktop/src/native_operation.rs; target canopi-support/src (N1); example desktop/src/native_operation.rs"
files:
  - "{desktop,common-types,bindings-gen}/src/**/*.rs"
  - "policy/fixtures/rules/*/{desktop,common-types,bindings-gen}/src/**/*.rs"
ignores:
  - "desktop/src/db/test_support.rs"
  - "desktop/src/db/plant_filter_fields.rs"
  - "desktop/src/db/schema_contract_generated.rs"
  - "desktop/src/design/new_design_defaults.rs"
  - "desktop/src/ci_lane_policy.rs"
  - "desktop/src/module_layering.rs"
  - "desktop/src/native_command_policy.rs"
  - "desktop/src/test_scratch.rs"
  - "desktop/src/services/lidar/analyses/tests/**"
  - "desktop/src/services/lidar/analysis_registry_generated.rs"
  - "desktop/src/services/lidar/acceptance_hooks.rs"
  - "desktop/src/services/lidar/e2e.rs"
  - "desktop/src/services/lidar/gdal_engine.rs"
  - "desktop/src/services/lidar/measurement.rs"
  - "desktop/src/services/lidar/fixed_library_tests.rs"
  - "desktop/src/services/lidar/rust_engine/crs/properties.rs"
  - "desktop/src/services/lidar/rust_engine/comparison.rs"
  - "desktop/src/services/lidar/rust_engine/crs_reference_points.rs"
  - "desktop/src/services/species_catalog_read/test_support.rs"
  - "desktop/src/native_operation.rs"
  - "policy/fixtures/rules/*/desktop/src/native_operation.rs"
rule:
  all:
    - kind: call_expression
      has:
        field: function
        regex: ^(tauri::async_runtime|async_runtime|tokio|tokio::task)::spawn$
    - not: { matches: test-code }
utils:
  # Inline test code: an item (a `mod tests`, a test fn, a cfg(test) helper) whose attributes name test.
  test-code:
    inside:
      stopBy: end
      follows:
        kind: attribute_item
        regex: '^#\[(cfg\((test|all\(test\b)|test\]|tokio::test)'
        stopBy: { not: { any: [ { kind: attribute_item }, { kind: line_comment }, { kind: block_comment } ] } }
