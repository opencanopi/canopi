# favorites-imports-only-scene-edit-surface (FAP conversion, F1a): Favorites controller uses Scene Edit commands only
id: favorites-imports-only-scene-edit-surface.tsx
language: tsx
severity: error
message: "Favorites controller uses Scene Edit commands only; owner desktop/web/src/canvas/session.ts; example desktop/web/src/canvas/session.ts"
files:
  - "{desktop/web,policy/fixtures/rules/*}/src/**/__none__.tsx"
ignores:
  - "{desktop/web,policy/fixtures/rules/*}/src/__tests__/**"
  - "{desktop/web,policy/fixtures/rules/*}/src/**/*.test.ts"
  - "{desktop/web,policy/fixtures/rules/*}/src/**/*.test.tsx"
utils:
  target-module:
    kind: string_fragment
    regex: '(^|/)canvas/session(\.tsx?)?$'
rule:
  any:
    - kind: import_specifier
      inside: { stopBy: end, kind: import_statement, has: { field: source, has: { matches: target-module } } }
      not: { has: { field: name, regex: ^(currentCanvasSceneEditCommandSurface)$ } }
    - kind: namespace_import
      inside: { stopBy: end, kind: import_statement, has: { field: source, has: { matches: target-module } } }
    - kind: program
      not: { has: { stopBy: end, kind: import_specifier, has: { field: name, regex: ^currentCanvasSceneEditCommandSurface$ }, inside: { stopBy: end, kind: import_statement, has: { field: source, has: { matches: target-module } } } } }
