# no-correlation-field (§18 F17, ADR 0025, 2.1-M411): no correlation or sequence field in Failure,
# ring entries or log fields other than operation, job_id and item_id.
# message and ignores: generated from policy/primitives.json.
id: no-correlation-field.typescript
language: typescript
severity: error
message: "no-correlation-field (§18 F17): no correlation or sequence field in Failure, ring entries or log fields but operation, job_id and item_id; 2a's invokeTyped and its minters carry OperationId (2.1-M411, canopi-f47t.52.70). ADR 0025; owner none; example desktop/web/src/failures/ring.ts"
files:
  - "{desktop/web,policy/fixtures/rules/*}/src/**/*.ts"
ignores:
  - "{desktop/web,policy/fixtures/rules/*}/src/__tests__/**"
  - "{desktop/web,policy/fixtures/rules/*}/src/**/__fixtures__/**"
  - "{desktop/web,policy/fixtures/rules/*}/src/**/*.test.ts"
  - "{desktop/web,policy/fixtures/rules/*}/src/**/*.test.tsx"
  - "{desktop/web,policy/fixtures/rules/*}/src/generated/**"
  - "{desktop/web,policy/fixtures/rules/*}/src/editions/gallery/**"
rule:
  any:
    - kind: property_identifier
    - kind: shorthand_property_identifier
    - kind: shorthand_property_identifier_pattern
  regex: ^(correlationId|correlation_id|traceId|trace_id|sequenceId|sequence_id|seqId|seq_id)$
