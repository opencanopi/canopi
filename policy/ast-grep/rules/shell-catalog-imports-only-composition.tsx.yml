# shell-catalog-imports-only-composition (FAP conversion, F1a): Desktop command catalog composes neutral shell capabilities
id: shell-catalog-imports-only-composition.tsx
language: tsx
severity: error
message: "Desktop command catalog composes neutral shell capabilities; owner desktop/web/src/app/shell-commands/index.ts; example desktop/web/src/app/shell-commands/index.ts"
files:
  - "{desktop/web,policy/fixtures/rules/*}/src/**/__none__.tsx"
ignores:
  - "{desktop/web,policy/fixtures/rules/*}/src/__tests__/**"
  - "{desktop/web,policy/fixtures/rules/*}/src/**/*.test.ts"
  - "{desktop/web,policy/fixtures/rules/*}/src/**/*.test.tsx"
utils:
  target-module:
    kind: string_fragment
    regex: '(^|/)app/shell-commands(/index)?(\.tsx?)?$'
rule:
  any:
    - kind: import_specifier
      inside: { stopBy: end, kind: import_statement, has: { field: source, has: { matches: target-module } } }
      not: { has: { field: name, regex: ^(composeShellCommandCatalog|ShellCommandCatalogEntry|ShellCommandIdForCapability|ShellCommandState)$ } }
    - kind: namespace_import
      inside: { stopBy: end, kind: import_statement, has: { field: source, has: { matches: target-module } } }
    - kind: program
      not: { has: { stopBy: end, kind: import_specifier, has: { field: name, regex: ^composeShellCommandCatalog$ }, inside: { stopBy: end, kind: import_statement, has: { field: source, has: { matches: target-module } } } } }
