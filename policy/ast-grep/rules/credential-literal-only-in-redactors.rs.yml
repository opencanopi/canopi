# credential-literal-only-in-redactors (§18 F24), Rust half (design check F6): a string literal that is a credential
# parameter name (api-key, api_key, apikey, access_token, with or without its `=`) or a `name=` form (key=, session=,
# token=), only in the redactor: canopi-redact's generated table, which reads canopi-types/redaction.json. Bare `"key"`
# is too common a word to count.
# message and ignores: generated from policy/primitives.json.
id: credential-literal-only-in-redactors.rs
language: rs
severity: error
message: "credential-literal-only-in-redactors (§18 F24): credential-name literals and user-path regexes live only in the redactor (failures/redact.ts from 1b; canopi-redact natively). ADR 0025; owner desktop/web/src/failures/redact.ts; target desktop/web/src/failures/redact.ts (1b); example desktop/web/src/failures/redact.ts"
# rust-scope: desktop/src canopi-types/src
files:
  - "{desktop/src,canopi-types/src}/**/*.rs"
  - "policy/fixtures/rules/*/{desktop/src,canopi-types/src}/**/*.rs"
ignores:
  - "desktop/src/commands/design/tests.rs"
  - "desktop/src/db/test_support.rs"
  - "desktop/src/db/plant_filter_fields.rs"
  - "desktop/src/db/schema_contract_generated.rs"
  - "desktop/src/design/new_design_defaults.rs"
  - "desktop/src/host/dialogs/tests.rs"
  - "desktop/src/ci_lane_policy.rs"
  - "desktop/src/module_layering.rs"
  - "desktop/src/module_layering/**"
  - "desktop/src/native_command_policy.rs"
  - "desktop/src/test_scratch.rs"
  - "desktop/src/logging/tests.rs"
  - "desktop/src/module_layering/tests.rs"
  - "desktop/src/native_operation/tests.rs"
  - "desktop/src/native_operation/tests/**"
  - "desktop/src/services/lidar/analyses/tests/**"
  - "desktop/src/services/lidar/analysis_registry_generated.rs"
  - "desktop/src/services/lidar/acceptance_hooks.rs"
  - "desktop/src/services/lidar/e2e.rs"
  - "desktop/src/services/lidar/gdal_engine.rs"
  - "desktop/src/services/lidar/measurement.rs"
  - "desktop/src/services/lidar/fixed_library_tests.rs"
  - "desktop/src/services/lidar/reader_release_tests.rs"
  - "desktop/src/services/lidar/rust_engine/crs/properties.rs"
  - "desktop/src/services/lidar/rust_engine/comparison.rs"
  - "desktop/src/services/lidar/rust_engine/crs_reference_points.rs"
  - "desktop/src/services/settings_reader_release_tests.rs"
  - "desktop/src/services/problem_report/tests.rs"
  - "desktop/src/services/species_catalog_read/test_support.rs"
  - "canopi-types/src/design/tests.rs"
  - "canopi-types/src/failure/tests.rs"
  - "canopi-types/src/views/tests.rs"
  - "canopi-redact/src/tests.rs"
  - "canopi-redact/src/table_generated.rs"
  - "canopi-format-wasm/src/tests.rs"
  - "bindings-gen/src/plan_support.rs"
rule:
  all:
    - kind: string_literal
      regex: '^"((?i:api[-_]?key|apikey|access_token)=?|(?i:key|session|token)=)"$'
    - not: { matches: test-code }
utils:
  # Inline test code: an item (a `mod tests`, a test fn, a cfg(test) helper) whose attributes name test.
  test-code:
    inside:
      stopBy: end
      follows:
        kind: attribute_item
        regex: '^#\[(cfg\((test|all\(test\b)|test\]|tokio::test)'
        stopBy: { not: { any: [ { kind: attribute_item }, { kind: line_comment }, { kind: block_comment } ] } }
