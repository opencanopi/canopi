# test-only-exports-only-in-tests (FAP conversion, F1a; widened by canopi-f47t.52.242): Production code calls no test-only export
id: test-only-exports-only-in-tests.typescript
language: typescript
severity: error
message: "Production code calls no test-only export (a `*ForTests` reset or the Design Session test fixture); owner desktop/web/src/__tests__; example desktop/web/src/app/document-session/store.ts"
files:
  - "{desktop/web,policy/fixtures/rules/*}/src/**/*.ts"
ignores:
  - "{desktop/web,policy/fixtures/rules/*}/src/__tests__/**"
  - "{desktop/web,policy/fixtures/rules/*}/src/**/*.test.ts"
  - "{desktop/web,policy/fixtures/rules/*}/src/**/*.test.tsx"
rule:
  any:
    - kind: identifier
    - kind: property_identifier
    - kind: type_identifier
    - kind: shorthand_property_identifier
    - kind: shorthand_property_identifier_pattern
  regex: ^(createDesignSessionStoreTestFixture|[A-Za-z]\w*ForTests)$
  not:
    inside:
      kind: function_declaration
      field: name
