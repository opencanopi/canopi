          - inside:
              kind: program
              stopBy: end
              has:
                stopBy: end
                any:
                  - kind: variable_declarator
                    all:
                      - has: { field: name, pattern: $R }
                      - has:
                          field: value
                          kind: call_expression
                          has: { field: function, kind: identifier, pattern: $B, not: { regex: ^(useRef|createRef)$ } }
                  - kind: required_parameter
                    not:
                      has:
                        field: type
                        has: { kind: generic_type, has: { field: name, regex: ^(RefObject|MutableRef|Ref)$ } }
                    all:
                      - has:
                          field: pattern
                          any:
                            - pattern: $R
                            - kind: object_pattern
                              has: { stopBy: end, kind: shorthand_property_identifier_pattern, pattern: $R }
                      - has:
                          field: type
                          has:
                            stopBy: end
                            kind: type_identifier
                            pattern: $B
                            not: { regex: ^(RefObject|MutableRef|Ref)$ }
          - inside: { stopBy: end, matches: imports-b }
  value-target:
    kind: member_expression
    has: { field: property, regex: ^value$ }
