# edition-ports-installed-only-by-roots (ADR 0022, 2.1-M186): only an edition root installs its
# EditionPorts record or CanvasHost runtime factory.
id: edition-ports-installed-only-by-roots.typescript
language: typescript
severity: error
message: "Only an edition root (desktop/web/src/editions/**) may install EditionPorts or CanvasHost runtime (ADR 0022, 2.1-M186); owner desktop/web/src/editions; example desktop/web/src/editions/desktop/boot.ts"
files:
  - "{desktop/web,policy/fixtures/rules/*}/src/**/*.ts"
ignores:
  - "{desktop/web,policy/fixtures/rules/*}/src/__tests__/**"
  - "{desktop/web,policy/fixtures/rules/*}/src/**/*.test.ts"
  - "{desktop/web,policy/fixtures/rules/*}/src/**/*.test.tsx"
  - "{desktop/web,policy/fixtures/rules/*}/src/editions/**"
  - "{desktop/web,policy/fixtures/rules/*}/src/platform/edition-ports.ts"
  - "{desktop/web,policy/fixtures/rules/*}/src/app/canvas-map-surface/use-canvas-host.ts"
rule:
  any:
    - kind: identifier
    - kind: property_identifier
    - kind: type_identifier
    - kind: shorthand_property_identifier
    - kind: shorthand_property_identifier_pattern
  regex: ^(installEditionPorts|installCanvasHostRuntime)$
