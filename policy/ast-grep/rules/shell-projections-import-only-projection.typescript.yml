# shell-projections-import-only-projection (FAP conversion, F1a): Desktop chrome projects the neutral shell catalog
id: shell-projections-import-only-projection.typescript
language: typescript
severity: error
message: "Desktop chrome projects the neutral shell catalog; owner desktop/web/src/app/shell-commands/index.ts; example desktop/web/src/app/shell-commands/index.ts"
files:
  - "{desktop/web,policy/fixtures/rules/*}/src/commands/graph/projections.ts"
ignores:
  - "{desktop/web,policy/fixtures/rules/*}/src/__tests__/**"
  - "{desktop/web,policy/fixtures/rules/*}/src/**/*.test.ts"
  - "{desktop/web,policy/fixtures/rules/*}/src/**/*.test.tsx"
utils:
  target-module:
    kind: string_fragment
    regex: '(^|/)app/shell-commands(/index)?(\.tsx?)?$'
rule:
  any:
    - kind: import_specifier
      inside: { stopBy: end, kind: import_statement, has: { field: source, has: { matches: target-module } } }
      not: { has: { field: name, regex: ^(projectShellCommandCatalog|ProjectedShellCommand)$ } }
    - kind: namespace_import
      inside: { stopBy: end, kind: import_statement, has: { field: source, has: { matches: target-module } } }
    - kind: program
      not: { has: { stopBy: end, kind: import_specifier, has: { field: name, regex: ^projectShellCommandCatalog$ }, inside: { stopBy: end, kind: import_statement, has: { field: source, has: { matches: target-module } } } } }
