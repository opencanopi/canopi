# geolocation-only-in-geolocation-module (FAP conversion, F1a): P53 only the geolocation module calls watchPosition, getCurrentPosition or clearWatch
id: geolocation-only-in-geolocation-module.typescript
language: typescript
severity: error
message: "P53 only the geolocation module calls watchPosition, getCurrentPosition or clearWatch; owner desktop/web/src/app/my-location/geolocation.ts; example desktop/web/src/app/my-location/geolocation.ts"
files:
  - "{desktop/web,policy/fixtures/rules/*}/src/**/*.ts"
ignores:
  - "{desktop/web,policy/fixtures/rules/*}/src/__tests__/**"
  - "{desktop/web,policy/fixtures/rules/*}/src/**/*.test.ts"
  - "{desktop/web,policy/fixtures/rules/*}/src/**/*.test.tsx"
  - "{desktop/web,policy/fixtures/rules/*}/src/app/my-location/geolocation.ts"
utils:
  # the callee by name, dotted or by bracket (`geo['clearWatch']`, `geo?.["watchPosition"]`); optional chains are part
  # of either node
  named-callee:
    any:
      - kind: member_expression
        has: { field: property, regex: ^(watchPosition|getCurrentPosition|clearWatch)$ }
      - kind: subscript_expression
        has: { field: index, regex: '^[''"`](watchPosition|getCurrentPosition|clearWatch)[''"`]$' }
rule:
  kind: call_expression
  has:
    field: function
    any:
      - matches: named-callee
      # a non-null callee: `geo.clearWatch!(3)`
      - kind: non_null_expression
        has: { matches: named-callee }
