# plant-color-menu-imports-only-presentation-surfaces (FAP conversion, F1a): Plant Color Menu uses presentation, query, and selection surfaces only
id: plant-color-menu-imports-only-presentation-surfaces.tsx
language: tsx
severity: error
message: "Plant Color Menu uses presentation, query, and selection surfaces only; owner desktop/web/src/canvas/session.ts; example desktop/web/src/canvas/session.ts"
files:
  - "{desktop/web,policy/fixtures/rules/*}/src/components/canvas/PlantColorMenu.tsx"
ignores:
  - "{desktop/web,policy/fixtures/rules/*}/src/__tests__/**"
  - "{desktop/web,policy/fixtures/rules/*}/src/**/*.test.ts"
  - "{desktop/web,policy/fixtures/rules/*}/src/**/*.test.tsx"
utils:
  target-module:
    kind: string_fragment
    regex: '(^|/)canvas/session(\.tsx?)?$'
rule:
  any:
    - kind: import_specifier
      inside: { stopBy: end, kind: import_statement, has: { field: source, has: { matches: target-module } } }
      not: { has: { field: name, regex: ^(currentCanvasPlantPresentationCommandSurface|currentCanvasQuerySurface|currentCanvasSelection)$ } }
    - kind: namespace_import
      inside: { stopBy: end, kind: import_statement, has: { field: source, has: { matches: target-module } } }
    - kind: program
      not: { has: { stopBy: end, kind: import_specifier, has: { field: name, regex: ^currentCanvasPlantPresentationCommandSurface$ }, inside: { stopBy: end, kind: import_statement, has: { field: source, has: { matches: target-module } } } } }
    - kind: program
      not: { has: { stopBy: end, kind: import_specifier, has: { field: name, regex: ^currentCanvasQuerySurface$ }, inside: { stopBy: end, kind: import_statement, has: { field: source, has: { matches: target-module } } } } }
    - kind: program
      not: { has: { stopBy: end, kind: import_specifier, has: { field: name, regex: ^currentCanvasSelection$ }, inside: { stopBy: end, kind: import_statement, has: { field: source, has: { matches: target-module } } } } }
