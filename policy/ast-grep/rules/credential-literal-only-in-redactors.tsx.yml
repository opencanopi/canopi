# credential-literal-only-in-redactors (§18 F24): a regex naming a credential parameter (key, api-key, apikey,
# session, token, access_token, password, secret) or a user path (/home/, /Users/, file:, a drive letter), only in the TS redactors: the map
# redactor today (owner) and the problem report's path redactor (an entry, a `new RegExp` over a path or credential
# string), failures/redact.ts alone from 1b (two to one).
# message and ignores: generated from policy/primitives.json.
id: credential-literal-only-in-redactors.tsx
language: tsx
severity: error
message: "credential-literal-only-in-redactors (§18 F24): credential-name literals and user-path regexes live only in the redactor (failures/redact.ts from 1b; canopi-redact natively). ADR 0025; owner desktop/web/src/maplibre/redact-credentials.ts; target desktop/web/src/failures/redact.ts (1b); example desktop/web/src/maplibre/redact-credentials.ts"
files:
  - "{desktop/web,policy/fixtures/rules/*}/src/**/*.tsx"
ignores:
  - "{desktop/web,policy/fixtures/rules/*}/src/__tests__/**"
  - "{desktop/web,policy/fixtures/rules/*}/src/**/__fixtures__/**"
  - "{desktop/web,policy/fixtures/rules/*}/src/**/*.test.ts"
  - "{desktop/web,policy/fixtures/rules/*}/src/**/*.test.tsx"
  - "{desktop/web,policy/fixtures/rules/*}/src/generated/**"
  - "{desktop/web,policy/fixtures/rules/*}/src/maplibre/redact-credentials.ts"
rule:
  any:
    - kind: regex_pattern
      regex: '(?i:api[-_]?key|apikey|access_token|password|secret)|\b(key|session|token)\b|\\?/home\\?/|\\?/Users\\?/|file:|\[A-Za-z\]:'
    - kind: new_expression
      all:
        - has:
            field: constructor
            regex: ^RegExp$
        - has:
            field: arguments
            has:
              any:
                - kind: string
                - kind: template_string
                - kind: call_expression
              regex: '(?i:api[-_]?key|apikey|access_token|password|secret)|\b(key|session|token)\b|\\?/home\\?/|\\?/Users\\?/|file:|\[A-Za-z\]:'
              stopBy: end
