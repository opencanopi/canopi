# worker-only-in-owner (§18 F16): `new Worker`, `new SharedWorker` and a Vite `?worker` import only in the module
# that starts each worker: the raster display pool, the species reader, the PDF job and the MapLibre loader (its worker
# URL). A new worker joins also_owners in the change that adds it. 0 outside today.
# message and ignores: generated from policy/primitives.json.
id: worker-only-in-owner.tsx
language: tsx
severity: error
message: "worker-only-in-owner (§18 F16): a worker is started (new Worker, new SharedWorker, a ?worker import) only by the module that owns it. ADR 0028; owner desktop/web/src/maplibre/raster-display/pool.ts (also desktop/web/src/web/duckdb-wasm-catalog.ts, desktop/web/src/app/canvas-pdf/job.ts, desktop/web/src/maplibre/loader.ts); target desktop/web/src/maplibre/raster-display/pool.ts (2b); example desktop/web/src/maplibre/raster-display/pool.ts"
files:
  - "{desktop/web,policy/fixtures/rules/*}/src/**/*.tsx"
ignores:
  - "{desktop/web,policy/fixtures/rules/*}/src/__tests__/**"
  - "{desktop/web,policy/fixtures/rules/*}/src/**/__fixtures__/**"
  - "{desktop/web,policy/fixtures/rules/*}/src/**/*.test.ts"
  - "{desktop/web,policy/fixtures/rules/*}/src/**/*.test.tsx"
  - "{desktop/web,policy/fixtures/rules/*}/src/generated/**"
  - "{desktop/web,policy/fixtures/rules/*}/src/maplibre/raster-display/pool.ts"
  - "{desktop/web,policy/fixtures/rules/*}/src/web/duckdb-wasm-catalog.ts"
  - "{desktop/web,policy/fixtures/rules/*}/src/app/canvas-pdf/job.ts"
  - "{desktop/web,policy/fixtures/rules/*}/src/maplibre/loader.ts"
rule:
  any:
    - kind: new_expression
      has:
        field: constructor
        regex: ^(Shared)?Worker$
    - kind: string_fragment
      regex: \?(worker|sharedworker)(&|$)
      inside:
        any:
          - kind: import_statement
          - kind: call_expression
        stopBy: end
