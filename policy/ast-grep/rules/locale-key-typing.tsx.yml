# locale-key-typing (2.1-Q211, design-check A30): t takes the generated LocaleKey union, so a key English lacks fails
# typecheck. A key built at run time is a typed table lookup (Record<Union, LocaleKey>) or a template over a closed
# union; a value from an open set (a catalog value) goes through openSetText, whose key family is typed and whose value
# must be typed string (a literal or closed union fails typecheck), so it is no counted site. Two forms
# put a key no type checks back, so each is a counted site: a cast to LocaleKey, and an isLocaleKey call outside
# i18n/index.ts (its fallback hides a misspelled key). The planted violation is policy/fixtures/rules/locale-key-typing/.
id: locale-key-typing.tsx
language: tsx
severity: error
message: "locale-key-typing (2.1-Q211): a key built at run time is a typed table lookup (Record<Union, LocaleKey>), a template over a closed union or an open-set value through openSetText; a cast to LocaleKey or an isLocaleKey call is counted. owner desktop/web/src/i18n/index.ts; example desktop/web/src/app/planning-projection/timeline.ts"
files:
  - "{desktop/web/src,desktop/web/ui-gallery,policy/fixtures/rules/locale-key-typing}/**/*.tsx"
ignores:
  - "desktop/web/src/generated/**"
rule:
  any:
    - pattern: $VALUE as LocaleKey
    - pattern: isLocaleKey($$$ARGS)
---
# A key chosen by a count compared with 1: the reason and the two shapes are in locale-key-typing.yml's plural document.
id: locale-key-typing.tsx.plural
language: tsx
severity: error
message: "locale-key-typing (2.1-Q211, APP-06): a key chosen by a count compared with 1 drops the locale's other plural forms; pass { count } to one plural family (key_one, key_few, key_many, key_other). owner desktop/web/src/i18n/index.ts; example desktop/web/src/app/planning-projection/timeline.ts"
files:
  - "{desktop/web/src,desktop/web/ui-gallery,policy/fixtures/rules/locale-key-typing}/**/*.tsx"
ignores:
  - "desktop/web/src/generated/**"
utils:
  compares-with-one:
    any:
      - pattern: $A === 1
      - pattern: $A == 1
      - pattern: $A !== 1
      - pattern: $A != 1
      - pattern: 1 === $A
      - pattern: 1 == $A
      - pattern: 1 !== $A
      - pattern: 1 != $A
rule:
  kind: ternary_expression
  has:
    field: condition
    any:
      - matches: compares-with-one
      - kind: parenthesized_expression
        has:
          matches: compares-with-one
  any:
    - inside:
        kind: arguments
        inside:
          pattern: t($$$)
    - all:
        - has:
            field: consequence
            any:
              - pattern: t($$$)
              - has:
                  stopBy: end
                  pattern: t($$$)
        - has:
            field: alternative
            any:
              - pattern: t($$$)
              - has:
                  stopBy: end
                  pattern: t($$$)
        - not:
            has:
              stopBy: end
              pattern: t($$$)
              has:
                stopBy: end
                regex: ^count$
                any:
                  - kind: property_identifier
                  - kind: shorthand_property_identifier
