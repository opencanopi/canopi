language: tsx
severity: error
message: "item-types.ts is the one place that spells a RasterQuantity member (canopi-f47t.42); owner desktop/web/src/app/lidar/item-types.ts; example desktop/web/src/app/lidar/item-types.ts"
files:
  - "{desktop/web,policy/fixtures/rules/*}/src/**/*.tsx"
ignores:
