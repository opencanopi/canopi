  - "{desktop/web,policy/fixtures/rules/*}/src/**/*.test.ts"
  - "{desktop/web,policy/fixtures/rules/*}/src/**/*.test.tsx"
  - "{desktop/web,policy/fixtures/rules/*}/src/app/lidar/item-types.ts"
  - "{desktop/web,policy/fixtures/rules/*}/src/generated/**"
rule:
  kind: string_fragment
  # members: generate.mjs refuses this list when it differs from generated/contracts.ts's RasterQuantity union
  regex: ^(GroundElevation|SurfaceElevation|AboveGroundHeight|OtherContinuous|Slope)$
