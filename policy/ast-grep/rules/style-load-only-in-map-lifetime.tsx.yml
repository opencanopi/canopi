# style-load-only-in-map-lifetime (§18 F4, ADR 0024 Checks: four modules decide style readiness): an
# `isStyleLoaded` call, a 'style.load' or 'styledata' event string (literal types in declarations aside) and a map's
# `loaded()` (a receiver named map or ending in Map; PhotoViewer's `model.loaded()` is no map, DR20) only in
# maplibre/map-lifetime.ts (2d). Owner today none.
# message and ignores: generated from policy/primitives.json.
id: style-load-only-in-map-lifetime.tsx
language: tsx
severity: error
message: "style-load-only-in-map-lifetime (§18 F4): style readiness (isStyleLoaded, the style.load and styledata events, a map loaded() check) is decided only by the map lifetime. ADR 0024; owner none; target desktop/web/src/maplibre/map-lifetime.ts (2d); example none yet"
files:
  - "{desktop/web,policy/fixtures/rules/*}/src/**/*.tsx"
ignores:
  - "{desktop/web,policy/fixtures/rules/*}/src/__tests__/**"
  - "{desktop/web,policy/fixtures/rules/*}/src/**/__fixtures__/**"
  - "{desktop/web,policy/fixtures/rules/*}/src/**/*.test.ts"
  - "{desktop/web,policy/fixtures/rules/*}/src/**/*.test.tsx"
rule:
  any:
    - kind: call_expression
      has:
        field: function
        kind: member_expression
        has:
          field: property
          regex: ^isStyleLoaded$
    - kind: call_expression
      has:
        field: function
        kind: member_expression
        all:
          - has:
              field: property
              regex: ^loaded$
          - has:
              field: object
              regex: (^|\.)(map|\w*Map)$
    - kind: string
      regex: ^['"](style\.load|styledata)['"]$
      not:
        inside:
          kind: literal_type
