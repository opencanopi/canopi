# scale-only-through-plane (§18 F36, 2.1-M40): Earth radii, latitude-based cosine scaling,
# and zoom-to-pixels-per-metre conversions live only in `desktop/web/src/geo/**`.
# message and ignores: generated from policy/primitives.json.
id: scale-only-through-plane.typescript
language: typescript
severity: error
message: "scale-only-through-plane (§18 F36): ground scale (Earth radii, latitude scale, zoom to pixels per metre, shown lengths and areas) only through the session plane (activated in 2m-1). ADR 0028; owner desktop/web/src/geo; example desktop/web/src/geo/session-plane.ts"
files:
  - "{desktop/web,policy/fixtures/rules/*}/src/**/*.ts"
ignores:
  - "{desktop/web,policy/fixtures/rules/*}/src/__tests__/**"
  - "{desktop/web,policy/fixtures/rules/*}/src/**/__fixtures__/**"
  - "{desktop/web,policy/fixtures/rules/*}/src/**/*.test.ts"
  - "{desktop/web,policy/fixtures/rules/*}/src/**/*.test.tsx"
  - "{desktop/web,policy/fixtures/rules/*}/src/generated/**"
  - "{desktop/web,policy/fixtures/rules/*}/src/editions/gallery/**"
  - "{desktop/web,policy/fixtures/rules/*}/src/geo/**"
rule:
  all:
    - not:
        pattern: Math.cos(3 * Math.PI / 180)
    - any:
        - kind: number
          regex: ^6371008(\.8)?$
        - pattern: stageScaleToMapZoom($$$)
        - pattern: mapZoomToStageScale($$$)
        - pattern: mercatorUnitsPerMeterAtLat($$$)
        - pattern: Math.cos($LAT * Math.PI / 180)
        - pattern: Math.cos(($LAT * Math.PI) / 180)
        - pattern: Math.cos($LAT * DEGREES_TO_RADIANS)
