# console-only-in-sink (§18 F23): a console member read (a call, a reference, by bracket) and a window error hook (`addEventListener('error' or
# 'unhandledrejection')` on window, globalThis or self, an `onerror` or `onunhandledrejection` assignment) only in the
# failures/ sink, reportFailure (1b, then each stream that moves a surface; 0 at Phase 3). oxlint's no-console is left
# out for this rule (2.1-M218). Owner today none.
# message and ignores: generated from policy/primitives.json.
id: console-only-in-sink.tsx
language: tsx
severity: error
message: "console-only-in-sink (§18 F23): console output and the window error hooks (error, unhandledrejection) only in the failures/ sink, reportFailure. ADR 0025; owner desktop/web/src/failures/report.ts; target desktop/web/src/failures (3); example desktop/web/src/failures/report.ts"
files:
  - "{desktop/web,policy/fixtures/rules/*}/src/**/*.tsx"
ignores:
  - "{desktop/web,policy/fixtures/rules/*}/src/__tests__/**"
  - "{desktop/web,policy/fixtures/rules/*}/src/**/__fixtures__/**"
  - "{desktop/web,policy/fixtures/rules/*}/src/**/*.test.ts"
  - "{desktop/web,policy/fixtures/rules/*}/src/**/*.test.tsx"
  - "{desktop/web,policy/fixtures/rules/*}/src/generated/**"
  - "{desktop/web,policy/fixtures/rules/*}/src/failures/report.ts"
rule:
  any:
    # any read of a console member, called or not (`console.error`, `const log = console.warn`), dotted, optional
    # (`globalThis.console?.error`), non-null (`window.console!.log`) or by bracket (`console['error']`)
    - kind: member_expression
      has:
        field: object
        regex: ^((globalThis|window|self)\s*\??\.\s*)?console!?$
    - kind: subscript_expression
      has:
        field: object
        regex: ^((globalThis|window|self)\s*\??\.\s*)?console!?$
    - kind: call_expression
      all:
        - has:
            field: function
            regex: ^((globalThis|window|self)\s*\.\s*)?addEventListener$
        - has:
            field: arguments
            has:
              kind: string
              regex: ^['"](error|unhandledrejection)['"]$
    - kind: assignment_expression
      has:
        field: left
        regex: ^((globalThis|window|self)\s*\.\s*)?on(error|unhandledrejection)$
