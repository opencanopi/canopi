utils:
  fs-read:
    kind: call_expression
    has:
      field: function
      regex: '(^|\.)(readFileSync|readFile|readdirSync|readdir)$'
  data-path:
    kind: string_fragment
    regex: '\.(json|ya?ml|html|md|lock|tif|wasm|ttf|otf|woff2?|canopi|png|svg)$|(^|/)(node_modules|fixtures|fonts|i18n)(/|$)|^\.\./\.\./'
  source-path:
    kind: string_fragment
    any:
      - regex: '\.(tsx?|mjs|js|css)$'
      - regex: '(^|/)src(/|$)'
rule:
  any:
    - matches: fs-read
      has:
        field: arguments
        stopBy: end
        matches: source-path
      not:
        has:
          field: arguments
          stopBy: end
          matches: data-path
    - matches: fs-read
      has:
        field: arguments
        stopBy: end
        any:
          - pattern: import.meta.url
          - pattern: __dirname
      not:
        has:
          field: arguments
          stopBy: end
          matches: data-path
    - any:
        - pattern: join(__dirname, $$$PARTS)
        - pattern: resolve(__dirname, $$$PARTS)
      not:
        inside:
          stopBy: end
          matches: fs-read
    - kind: call_expression
      not:
        has:
          field: function
          regex: 'Attribute$'
      has:
        field: arguments
        all:
          - has:
              nthChild: 1
              kind: string
              has:
                kind: string_fragment
                regex: '^(\./)?src(/[\w-]+)*/?$'
                not:
                  matches: data-path
          - not:
              has:
                nthChild: 2
    - kind: variable_declarator
      has:
        field: value
        kind: string
        has:
          matches: source-path
          not:
            regex: '^\.?\.?/[^/]*$'
      not:
        has:
          field: value
          stopBy: end
          matches: data-path
