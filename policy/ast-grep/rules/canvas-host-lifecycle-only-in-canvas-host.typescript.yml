# canvas-host-lifecycle-only-in-canvas-host (ADR 0024, 2.1-M144): only canvas-host.ts acquires
# the canvas runtime lease, publishes the canvas session, or calls attachScene / detachScene.
id: canvas-host-lifecycle-only-in-canvas-host.typescript
language: typescript
severity: error
message: "Only app/canvas-map-surface/canvas-host.ts may acquire the canvas runtime lease, publish the canvas session, or call attachScene/detachScene (ADR 0024, 2.1-M144); owner desktop/web/src/app/canvas-map-surface/canvas-host.ts; example desktop/web/src/app/canvas-map-surface/canvas-host.ts"
files:
  - "{desktop/web,policy/fixtures/rules/*}/src/**/*.ts"
ignores:
  - "{desktop/web,policy/fixtures/rules/*}/src/__tests__/**"
  - "{desktop/web,policy/fixtures/rules/*}/src/**/*.test.ts"
  - "{desktop/web,policy/fixtures/rules/*}/src/**/*.test.tsx"
  - "{desktop/web,policy/fixtures/rules/*}/src/app/canvas-map-surface/canvas-host.ts"
  - "{desktop/web,policy/fixtures/rules/*}/src/canvas/session.ts"
  - "{desktop/web,policy/fixtures/rules/*}/src/canvas/runtime/lifecycle-owner.ts"
rule:
  any:
    - all:
        - any:
            - kind: identifier
            - kind: property_identifier
            - kind: shorthand_property_identifier
        - regex: ^(acquireCanvasRuntimeLifecycle|setCurrentCanvasSession)$
    - kind: call_expression
      pattern: $OBJ.attachScene($$$)
    - kind: call_expression
      pattern: $OBJ.detachScene($$$)
