# P46 (AGENTS.md Secrets): the Google key and the settings snapshot have reviewed readers; a named, namespace,
# re-exported or dynamic import of them elsewhere is a site.
id: google-key-only-in-reviewed-readers-typescript
language: typescript
severity: error
message: the Google key or the settings snapshot is read outside its reviewed readers
files:
  - src/**/*.ts
ignores:
  - src/app/settings/**
  - src/components/shared/SettingsGoogleKeyField.tsx
  - src/app/canvas-layer-presentation/presentation.ts
  - src/__tests__/**
  - src/**/*.test.ts
utils:
  settings-module:
    kind: string_fragment
    regex: (^|/)settings/(state|projection)(\.ts)?$
rule:
  any:
    # import { googleMapsApiKey } / import * as s / export { googleMapsApiKey } from / export * from
    - kind: import_statement
      has: { field: source, has: { matches: settings-module } }
      any:
        - has: { stopBy: end, kind: namespace_import }
        - has:
            stopBy: end
            kind: import_specifier
            has: { field: name, regex: ^(googleMapsApiKey|activeGoogleMapsApiKey|snapshotSettingsProjection)$ }
    - kind: export_statement
      has: { field: source, has: { matches: settings-module } }
      any:
        - not: { has: { kind: export_clause } }
        - has:
            stopBy: end
            kind: export_specifier
            has: { field: name, regex: ^(googleMapsApiKey|activeGoogleMapsApiKey|snapshotSettingsProjection)$ }
    # any dynamic import of the two modules: stricter than FAP's member tracking, and clean on HEAD
    - kind: call_expression
      all:
        - has: { field: function, kind: import }
        - has: { field: arguments, has: { stopBy: end, matches: settings-module } }
