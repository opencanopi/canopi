# P49: only IPC transports invoke native commands; a symbol rule, so a namespace or dynamic import is caught too.
id: invoke-only-in-ipc-tsx
language: tsx
severity: error
message: invoke outside ipc/; native commands go through an IPC transport
files:
  - src/**/*.tsx
ignores:
  - src/ipc/**
  - src/app/shell/bootstrap.ts
  - src/app/canvas-pdf/platform.desktop.ts
  - src/__tests__/**
  - src/**/*.test.tsx
rule:
  any:
    - kind: identifier
    - kind: property_identifier
    - kind: shorthand_property_identifier
    - kind: shorthand_property_identifier_pattern
  regex: ^invoke$
