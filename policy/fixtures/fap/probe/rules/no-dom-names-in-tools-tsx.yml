# P5: a tool, the point editor and the path engine name no DOM event, element or camera; globals need no import.
id: no-dom-names-in-tools-tsx
language: tsx
severity: error
message: a tool names a DOM event, element or camera; only the tool host converts screen to world
files:
  - src/canvas/runtime/tools/**/*.tsx
  - src/canvas/point-editor/**/*.tsx
  - src/canvas/plant-path/**/*.tsx
ignores:
  - src/canvas/runtime/tools/tool-host.ts
  - src/__tests__/**
  - src/**/*.test.tsx
rule:
  any:
    - kind: identifier
    - kind: property_identifier
    - kind: type_identifier
    - kind: shorthand_property_identifier
  regex: ^(document|window|HTMLElement|PointerEvent|KeyboardEvent|clientX|addEventListener|getBoundingClientRect|requestAnimationFrame|ViewTransform|CameraDriver|ViewNavigation)$
