# For F1b (P44): a settings signal written through a namespace import of settings/state, matched in one file.
id: p44-namespace-write-probe-tsx
language: tsx
severity: error
message: a settings signal is written through a namespace import outside the projection
files:
  - src/**/*.tsx
rule:
  pattern: $NS.$SIG.value = $V
  inside:
    kind: program
    stopBy: end
    has:
      kind: import_statement
      all:
        - has: { field: source, has: { kind: string_fragment, regex: (^|/)settings/state$ } }
        - has: { stopBy: end, kind: namespace_import, has: { kind: identifier, pattern: $NS } }
constraints:
  SIG: { regex: ^(locale|theme|googleMapsApiKey|mapLayers)$ }
