id: probe-signal-write.typescript
language: typescript
severity: error
message: "probe (1): a .value write whose root is imported"
files:
  - "desktop/web/src/**/*.ts"
ignores:
  - "desktop/web/src/__tests__/**"
  - "desktop/web/src/**/__fixtures__/**"
  - "desktop/web/src/**/*.test.ts"
  - "desktop/web/src/**/*.test.tsx"
  - "desktop/web/src/generated/**"
utils:
  value-target:
    kind: member_expression
    has: { field: property, regex: ^value$ }
    any:
      - has: { field: object, kind: identifier, pattern: $R }
      - has:
          field: object
          kind: member_expression
          has: { field: object, kind: identifier, pattern: $R }
rule:
  all:
    - any:
        - kind: assignment_expression
          has: { field: left, matches: value-target }
        - kind: augmented_assignment_expression
          has: { field: left, matches: value-target }
        - kind: update_expression
          has: { field: argument, matches: value-target }
    - inside:
        kind: program
        stopBy: end
        has:
          kind: import_statement
          has:
            kind: import_clause
            has:
              stopBy: end
              any:
                - { kind: identifier, pattern: $R, inside: { kind: import_clause } }
                - { kind: identifier, pattern: $R, inside: { kind: namespace_import } }
                - { kind: identifier, pattern: $R, inside: { kind: import_specifier, field: alias } }
                - kind: identifier
                  pattern: $R
                  inside: { kind: import_specifier, field: name, not: { has: { field: alias, kind: identifier } } }
