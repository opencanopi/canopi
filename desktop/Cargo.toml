[package]
name = "canopi-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# The MCP bridge (localhost WebSocket automation) is opt-in: `cargo tauri dev -f
# mcp-bridge`, and the macOS self-update probe's debug build in the updater-e2e
# workflow (`--features updater-e2e,mcp-bridge`, never with `e2e`; 2.1-Q136, M97),
# which `scripts/release_smoke.py macos-probe` drives on the CI runner instead of
# a product-side test hook. Its WebSocket has no authentication and no Origin
# check, so any local process or web page can drive the app while it runs. Only a
# debug build registers it, grants its capability and exposes `window.__TAURI__`
# (see `build.rs` and `lib.rs`); no release build carries it.
default = []
mcp-bridge = ["dep:tauri-plugin-mcp-bridge"]
# The binary the Desktop real-app suite drives (`npm run build:e2e`, 2.1-M213): a debug build only, never with the
# MCP bridge, never in a release workflow (`host/mod.rs`).
e2e = []
# The updater's end-to-end build (2.1-M205): its channel endpoint is a build override, so the N-1 to N test serves a
# local channel file. A debug build only: `host/updater/channel.rs` refuses it in a release build, and a test refuses
# it in the release workflows' feature lists.
updater-e2e = []

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2.12.4", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-single-instance = "2.5.4"
# External links (https, mailto) leave the app webview for the system browser
# or mail client; called from Rust only (`services/external_links.rs`).
tauri-plugin-opener = "2.7.2"
# Self-update (ADR 0029 Release safety, contracts §3 Updater): named only in `host/updater/`. Pinned exactly: its client
# is configured through `configure_client`, whose reqwest builder may change in a minor release. No `zip` feature: the
# v2 updater artifacts (NSIS, MSI, AppImage, .deb) are not archives.
# Release channels and the pending-update marker compare versions as semver, the updater plugin's own ordering.
semver = "1"
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["rustls-tls", "system-proxy"] }
# The updater client's redirect policy (allowed hosts only, 2.1-M210), named only in `http.rs`; no features of its own:
# it is the plugin's reqwest, whose features the plugin chooses.
reqwest = { version = "0.13", default-features = false }
rusqlite = { version = "0.37", features = ["bundled", "functions", "hooks"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tokio = { version = "1", features = ["macros", "sync", "time"] }
common-types = { path = "../common-types" }
sha2 = "0.10"
ureq = "3"
sys-locale = "0.3"
tauri-plugin-mcp-bridge = { version = "=0.13.1", optional = true }
# The pure-Rust raster engine (ADR 0014): GeoTIFF/COG primitives selected by
# GeoLibre (ADR 0002). Reached only through `services/lidar/rust_engine/` and
# the bounded reader in `services/lidar/prepared_raster.rs`.
# upstream: W12
wbgeotiff = { git = "https://github.com/opengeos/whitebox-wasm", rev = "9c0ff4fdf3513f27b89c78e294610c3b418b3a4f" }
# The one CRS authority (`rust_engine/crs.rs` on the `crs_table.rs` rows, U31):
# wbprojection placed national grids 30 m to 1,262 km off. Pinned exactly, as
# the reference points measure this version.
# upstream: W11
proj4rs = { version = "=0.2.0", default-features = false }

[dev-dependencies]
# Managed command state without a window/event loop in native boundary tests.
tauri = { version = "2.12.4", features = ["test"] }
syn = { version = "2", features = ["full", "visit"] }
# Property tests of the CRS authority and the raster grid math (ADR 0028 Model-based tests, 2.1-M234), on one
# shared fixed-seed config. `std` only: the fork and timeout runners are not used.
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
# The updater tests sign with an ephemeral minisign (Ed25519) key made in the test, so the release key never reaches a
# test (2.1-Q230).
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
# Free space is checked before a raster derivative or new numeric output is
# written; neither std nor the existing dependency tree can report capacity.
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
# Windows capacity check for the same preparation guard (see `libc` above).
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[lints]
workspace = true
