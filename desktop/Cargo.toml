[package]
name = "canopi-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# The MCP bridge (localhost WebSocket automation for `cargo tauri dev`) is
# opt-in: `cargo tauri dev -f mcp-bridge`. Its WebSocket has no authentication
# and no Origin check, so any local process or web page can drive the dev app
# while it runs. Only a debug build registers it, grants its capability and
# exposes `window.__TAURI__` (see `build.rs` and `lib.rs`).
default = []
mcp-bridge = ["dep:tauri-plugin-mcp-bridge"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2.12.4", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-single-instance = "2.5.4"
# External links (https, mailto) leave the app webview for the system browser
# or mail client; called from Rust only (`services/external_links.rs`).
tauri-plugin-opener = "2.7.2"
rusqlite = { version = "0.37", features = ["bundled", "functions", "hooks"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tokio = { version = "1", features = ["sync", "time"] }
common-types = { path = "../common-types" }
sha2 = "0.10"
ureq = "3"
sys-locale = "0.3"
tauri-plugin-mcp-bridge = { version = "=0.13.1", optional = true }
# The pure-Rust raster engine (ADR 0014): GeoTIFF/COG primitives selected by
# GeoLibre (ADR 0002). Reached only through `services/lidar/rust_engine/` and
# the bounded reader in `services/lidar/prepared_raster.rs`.
wbgeotiff = { git = "https://github.com/opengeos/whitebox-wasm", rev = "9c0ff4fdf3513f27b89c78e294610c3b418b3a4f" }
# The one CRS authority (`rust_engine/crs.rs` on the `crs_table.rs` rows, U31):
# wbprojection placed national grids 30 m to 1,262 km off. Pinned exactly, as
# the reference points measure this version.
proj4rs = { version = "=0.2.0", default-features = false }

[dev-dependencies]
# Managed command state without a window/event loop in native boundary tests.
tauri = { version = "2.12.4", features = ["test"] }
syn = { version = "2", features = ["full", "visit"] }

[target.'cfg(unix)'.dependencies]
# Free space is checked before a raster derivative or new numeric output is
# written; neither std nor the existing dependency tree can report capacity.
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
# Windows capacity check for the same preparation guard (see `libc` above).
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[lints]
workspace = true
